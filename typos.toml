# Spelling check for code, docs and messages. Runs in scripts/check.sh and CI.
[default]
extend-ignore-re = [
  # hashed asset names and ids in fixtures
  "[0-9a-f]{32,}",
]

[default.extend-words]
# Project words typos would otherwise flag.
serpdad = "serpdad"
khalid = "khalid"
# Partick is a part of Glasgow, in the Encore demo.
partick = "partick"
# The varn is the made-up currency of the Ticker demo.
varn = "varn"
varns = "varns"
hreflang = "hreflang"
minijinja = "minijinja"
# The German transliteration of ü, as in "ueber" for "über" (slugs, task 1.3).
ue = "ue"
# "Search" in German, a menu label in the demo example.
suche = "suche"
# German words on an embed's card (khalid-content, privacy plan U5).
sie = "sie"
adresse = "adresse"
# German and Spanish words in the multilingual example's settings and its
# English post on false friends.
methoden = "methoden"
sensibel = "sensibel"
instituto = "instituto"
# Words the demo publications use on purpose: an author's first name, the
# gardener's "first earlies" (early potatoes), audio's equivalent input
# noise (EIN), the No Derivatives licence (ND), and the misspelt variable a
# lesson on reading error messages is about.
ines = "ines"
earlies = "earlies"
ein = "ein"
nd = "nd"
vistor = "vistor"
# Craft and place words the batch 5 demos use: wood that is planed, a
# wheelwright's tyring day, the LK4 2PN postcode in Hearth and the Mabe
# Pepper chilli, named after the Cornish village of Mabe, in Inkwell.
planed = "planed"
tyring = "tyring"
pn = "pn"
mabe = "mabe"

[files]
# typos knows English only. German and Spanish content is checked by its
# writer, not by an English dictionary that reads "Sie" and "frase" as typos.
extend-exclude = ["target/", "node_modules/", "*.lock", ".claude/skills/rust-best-practices/references/", "**/content/de/", "**/content/es/", "crates/khalid-render/strings/de.toml", "crates/khalid-newsletter/strings/de.toml","crates/khalid-lint/src/german.rs",
  # A photo credit quotes the photo's title and its author's name as the
  # photographer wrote them, misspellings and other languages included.
  "**/ATTRIBUTION.md", "**/pages/photo-credits/"]
