# The showcase site: a fictional content studio's blog that uses every
# block, schema type and reader feature Khalid has. The feature tour page,
# /blog/feature-tour/, links each feature to the page that shows it. It is the public demo. Tests that
# need a small, stable site use fixtures/demo-site instead.

name = "Larkspur Ledger"
address = "https://www.example.com"
mount = "/blog/"
mode = "server"
default_language = "en"
languages = ["en", "de"]

# The one thing the blog asks a reader to do. Templates show it as a band,
# a header button or a box after a post; the classic look leaves it out.
[template.cta]
label = "Read the 2026 content benchmark"
href = "/blog/content-benchmark/"
note = "Numbers from 140 small business blogs, free to read."

# A button after each post and in the footer that adds the blog as a
# preferred source on Google.
[template.preferred_source]

# Pages an ::embed may show in a frame, beside the known video players:
# the live map in the search traffic post.
[media]
embed_domains = ["www.openstreetmap.org"]

# Links to the studio's own product carry utm tags, so its analytics
# show which post sent each visitor. No other link gets one.
[seo.links.tracking]
domains = ["planner.example.com"]

# A stand-in for an analytics tag, so every template's demo shows the
# consent banner. It runs only for a reader who allows Analytics, and then
# only marks the page: it sends nothing anywhere.
[[code]]
body = "<script>document.documentElement.dataset.visit = 'counted';</script>"
category = "analytics"
vendor = "Larkspur Studio"

# Who readers write to about their data, for the privacy page.
[privacy.contact]
name = "Larkspur Studio"
email = "privacy@example.com"
address = "Larkspur Studio, 21 Orchard Row, Bristol BS1 4QD, UK"

[seo.titles]
separator = "·"
tagline = "SEO and content writing notes from Larkspur Studio"

[seo.publisher]
type = "organization"
name = "Larkspur Studio"
email = "hello@example.com"
founded = "2017-03-01"

[seo.publisher.logo]
url = "https://www.example.com/blog/about/logo.svg"
alt = "The Larkspur Ledger logo, a violet larkspur flower beside the name"
width = 320
height = 80

[seo.ai_page]
covers = "Larkspur Studio writes about SEO, content strategy, technical SEO and how AI search picks its sources, for small marketing teams."
cite = "Name Larkspur Ledger and the author, and link the post you quote."
contact = "hello@example.com"

# Sign-ups for the newsletter. With this table a served showcase shows the
# templates' newsletter form. The mail server is a reserved example name,
# so nothing is ever sent.
[mail]
from = "letters@example.com"
name = "Larkspur Ledger"
postal_address = "Larkspur Studio, 21 Orchard Row, Bristol BS1 4QD, UK"

[mail.smtp]
host = "smtp.example.com"

[announcement]
text = "New: the 2026 content benchmark, with numbers from 140 small business blogs."
href = "/blog/content-benchmark/"
language = "en"

