<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t">
  <title id="t">Example data, not real figures: stacked bars of monthly AI referrals to a small blog from May to October, rising from about 40 to about 130 visits, with ChatGPT the largest source each month, then Perplexity, then other assistants</title>
  <rect width="640" height="360" fill="#f7f4ee"/>
  <text x="320" y="32" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="#2b2540">Example data: AI referrals a month, by source</text>
  <g stroke="#2b2540" stroke-opacity="0.15">
    <path d="M80 300 H600"/>
    <path d="M80 240 H600"/>
    <path d="M80 180 H600"/>
    <path d="M80 120 H600"/>
  </g>
  <g font-family="Georgia, serif" font-size="12" fill="#2b2540" text-anchor="end">
    <text x="70" y="304">0</text>
    <text x="70" y="244">40</text>
    <text x="70" y="184">80</text>
    <text x="70" y="124">120</text>
  </g>
  <g fill="#6b5ca5">
    <rect x="105" y="264" width="50" height="36"/>
    <rect x="190" y="252" width="50" height="48"/>
    <rect x="275" y="237" width="50" height="63"/>
    <rect x="360" y="222" width="50" height="78"/>
    <rect x="445" y="207" width="50" height="93"/>
    <rect x="530" y="189" width="50" height="111"/>
  </g>
  <g fill="#8fd9bd">
    <rect x="105" y="252" width="50" height="12"/>
    <rect x="190" y="237" width="50" height="15"/>
    <rect x="275" y="219" width="50" height="18"/>
    <rect x="360" y="201" width="50" height="21"/>
    <rect x="445" y="183" width="50" height="24"/>
    <rect x="530" y="162" width="50" height="27"/>
  </g>
  <g fill="#ffb38a">
    <rect x="105" y="243" width="50" height="9"/>
    <rect x="190" y="225" width="50" height="12"/>
    <rect x="275" y="204" width="50" height="15"/>
    <rect x="360" y="183" width="50" height="18"/>
    <rect x="445" y="162" width="50" height="21"/>
    <rect x="530" y="138" width="50" height="24"/>
  </g>
  <g font-family="Georgia, serif" font-size="13" fill="#2b2540" text-anchor="middle">
    <text x="130" y="320">May</text>
    <text x="215" y="320">Jun</text>
    <text x="300" y="320">Jul</text>
    <text x="385" y="320">Aug</text>
    <text x="470" y="320">Sep</text>
    <text x="555" y="320">Oct</text>
  </g>
  <g font-family="Georgia, serif" font-size="13" fill="#2b2540">
    <rect x="110" y="56" width="14" height="14" fill="#6b5ca5"/>
    <text x="130" y="68">ChatGPT</text>
    <rect x="230" y="56" width="14" height="14" fill="#8fd9bd"/>
    <text x="250" y="68">Perplexity</text>
    <rect x="360" y="56" width="14" height="14" fill="#ffb38a"/>
    <text x="380" y="68">Other assistants</text>
  </g>
  <text x="320" y="348" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#5b45d6">Invented numbers to show the shape of the report</text>
</svg>
