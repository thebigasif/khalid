<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t">
  <title id="t">Example data bar chart: posts published per month over six months. Burst plan: 5, 0, 0, 4, 0, 3. Steady plan: 2 every month. Both reach twelve posts.</title>
  <rect width="640" height="360" fill="#f7f4ee"/>
  <text x="320" y="32" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="#2b2540">Example data: posts per month, two plans of 12 posts</text>
  <g stroke="#2b2540" stroke-opacity="0.15">
    <line x1="70" y1="290" x2="610" y2="290"/>
    <line x1="70" y1="250" x2="610" y2="250"/>
    <line x1="70" y1="210" x2="610" y2="210"/>
    <line x1="70" y1="170" x2="610" y2="170"/>
    <line x1="70" y1="130" x2="610" y2="130"/>
    <line x1="70" y1="90" x2="610" y2="90"/>
  </g>
  <g font-family="Georgia, serif" font-size="13" fill="#2b2540" text-anchor="end">
    <text x="60" y="294">0</text>
    <text x="60" y="254">1</text>
    <text x="60" y="214">2</text>
    <text x="60" y="174">3</text>
    <text x="60" y="134">4</text>
    <text x="60" y="94">5</text>
  </g>
  <g fill="#ffb38a">
    <rect x="90" y="90" width="32" height="200"/>
    <rect x="270" y="130" width="32" height="160"/>
    <rect x="450" y="170" width="32" height="120"/>
  </g>
  <g fill="#6b5ca5">
    <rect x="126" y="210" width="32" height="80"/>
    <rect x="216" y="210" width="32" height="80"/>
    <rect x="306" y="210" width="32" height="80"/>
    <rect x="396" y="210" width="32" height="80"/>
    <rect x="486" y="210" width="32" height="80"/>
    <rect x="576" y="210" width="32" height="80"/>
  </g>
  <g font-family="Georgia, serif" font-size="14" fill="#2b2540" text-anchor="middle">
    <text x="124" y="312">Month 1</text>
    <text x="214" y="312">Month 2</text>
    <text x="304" y="312">Month 3</text>
    <text x="394" y="312">Month 4</text>
    <text x="484" y="312">Month 5</text>
    <text x="574" y="312">Month 6</text>
  </g>
  <rect x="180" y="330" width="16" height="16" fill="#ffb38a"/>
  <text x="204" y="343" font-family="Georgia, serif" font-size="14" fill="#2b2540">Burst plan</text>
  <rect x="340" y="330" width="16" height="16" fill="#6b5ca5"/>
  <text x="364" y="343" font-family="Georgia, serif" font-size="14" fill="#2b2540">Steady plan</text>
</svg>
