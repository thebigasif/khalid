<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t">
  <title id="t">A month of a content calendar, with one post planned each fortnight and a refresh slot in between</title>
  <rect width="640" height="360" fill="#f7f4ee"/>
  <rect x="40" y="40" width="560" height="280" rx="12" fill="#ffffff" stroke="#6b5ca5" stroke-width="3"/>
  <rect x="40" y="40" width="560" height="50" rx="12" fill="#6b5ca5"/>
  <text x="320" y="73" font-family="Georgia, serif" font-size="20" text-anchor="middle" fill="#ffffff">One month of the calendar</text>
  <g stroke="#d9d2ea" stroke-width="2">
    <line x1="180" y1="90" x2="180" y2="320"/>
    <line x1="320" y1="90" x2="320" y2="320"/>
    <line x1="460" y1="90" x2="460" y2="320"/>
  </g>
  <g font-family="Georgia, serif" font-size="16" text-anchor="middle" fill="#2b2540">
    <text x="110" y="120">Week one</text>
    <text x="250" y="120">Week two</text>
    <text x="390" y="120">Week three</text>
    <text x="530" y="120">Week four</text>
  </g>
  <rect x="60" y="150" width="100" height="70" rx="8" fill="#6b5ca5"/>
  <text x="110" y="191" font-family="Georgia, serif" font-size="15" text-anchor="middle" fill="#ffffff">New post</text>
  <rect x="200" y="150" width="100" height="70" rx="8" fill="#ffffff" stroke="#6b5ca5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="250" y="191" font-family="Georgia, serif" font-size="15" text-anchor="middle" fill="#2b2540">Refresh</text>
  <rect x="340" y="150" width="100" height="70" rx="8" fill="#6b5ca5"/>
  <text x="390" y="191" font-family="Georgia, serif" font-size="15" text-anchor="middle" fill="#ffffff">New post</text>
  <rect x="480" y="150" width="100" height="70" rx="8" fill="#ffffff" stroke="#6b5ca5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="530" y="191" font-family="Georgia, serif" font-size="15" text-anchor="middle" fill="#2b2540">Review</text>
  <text x="320" y="285" font-family="Georgia, serif" font-size="15" text-anchor="middle" fill="#2b2540">Solid boxes are new posts. Dashed boxes are time kept for old ones.</text>
</svg>
