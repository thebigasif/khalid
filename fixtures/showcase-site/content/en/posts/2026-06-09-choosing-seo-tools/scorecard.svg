<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t">
  <title id="t">Annotated mock scorecard with example scores for two made-up tools across six weighted criteria. Tool A totals 35 and Tool B totals 45. Callout 1 marks the weights, callout 2 the notes, callout 3 the totals</title>
  <rect width="640" height="400" fill="#f7f4ee"/>
  <rect x="20" y="20" width="600" height="360" rx="12" fill="#ffffff" stroke="#2b2540" stroke-opacity="0.15"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="17" fill="#2b2540">Tool trial scorecard (mock, example scores)</text>
  <rect x="40" y="66" width="560" height="28" fill="#6b5ca5" opacity="0.15"/>
  <g font-family="Georgia, serif" font-size="13" fill="#2b2540">
    <text x="50" y="85">Criterion</text>
    <text x="230" y="85">Weight</text>
    <text x="300" y="85">Tool A</text>
    <text x="370" y="85">Tool B</text>
    <text x="440" y="85">Notes</text>
    <text x="50" y="120">Fit to our jobs</text>
    <text x="250" y="120">3</text><text x="315" y="120">3</text><text x="385" y="120">5</text>
    <text x="440" y="120">B tracks by city</text>
    <text x="50" y="148">Time saved</text>
    <text x="250" y="148">3</text><text x="315" y="148">3</text><text x="385" y="148">4</text>
    <text x="440" y="148">Both automate reports</text>
    <text x="50" y="176">Data quality</text>
    <text x="250" y="176">2</text><text x="315" y="176">4</text><text x="385" y="176">3</text>
    <text x="440" y="176">A closer to console</text>
    <text x="50" y="204">Ease of use</text>
    <text x="250" y="204">1</text><text x="315" y="204">3</text><text x="385" y="204">5</text>
    <text x="50" y="232">Seats and sharing</text>
    <text x="250" y="232">1</text><text x="315" y="232">2</text><text x="385" y="232">4</text>
    <text x="50" y="260">Privacy and export</text>
    <text x="250" y="260">1</text><text x="315" y="260">4</text><text x="385" y="260">3</text>
  </g>
  <line x1="40" y1="280" x2="600" y2="280" stroke="#2b2540" stroke-opacity="0.3"/>
  <g font-family="Georgia, serif" font-size="15" fill="#2b2540">
    <text x="50" y="308">Weighted total</text>
    <text x="310" y="308">35</text>
  </g>
  <rect x="372" y="290" width="40" height="26" rx="6" fill="#8fd9bd"/>
  <text x="380" y="308" font-family="Georgia, serif" font-size="15" fill="#2b2540">45</text>
  <g fill="#5b45d6">
    <circle cx="276" cy="80" r="12"/>
    <circle cx="600" cy="148" r="12"/>
    <circle cx="436" cy="303" r="12"/>
  </g>
  <g font-family="Georgia, serif" font-size="13" fill="#ffffff" text-anchor="middle">
    <text x="276" y="85">1</text>
    <text x="600" y="153">2</text>
    <text x="436" y="308">3</text>
  </g>
  <text x="456" y="308" font-family="Georgia, serif" font-size="12" fill="#5b45d6">Fewer features, higher score</text>
  <text x="50" y="350" font-family="Georgia, serif" font-size="12" fill="#2b2540">Scores from 1 to 5. Total is each score times its weight, added up.</text>
</svg>
