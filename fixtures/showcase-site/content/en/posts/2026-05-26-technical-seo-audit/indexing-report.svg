<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t">
  <title id="t">Annotated mock of a page indexing report with example data: totals of indexed and not indexed pages, a list of reasons with counts, and sample URLs, marked with numbered callouts 1, 2 and 3</title>
  <rect width="640" height="400" fill="#f7f4ee"/>
  <rect x="20" y="20" width="600" height="360" rx="12" fill="#ffffff" stroke="#2b2540" stroke-opacity="0.15"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="17" fill="#2b2540">Page indexing (mock, example data)</text>
  <rect x="40" y="70" width="170" height="64" rx="8" fill="#8fd9bd" opacity="0.5"/>
  <rect x="226" y="70" width="170" height="64" rx="8" fill="#ffb38a" opacity="0.5"/>
  <g font-family="Georgia, serif" fill="#2b2540">
    <text x="54" y="96" font-size="13">Indexed</text>
    <text x="54" y="122" font-size="22">1,084</text>
    <text x="240" y="96" font-size="13">Not indexed</text>
    <text x="240" y="122" font-size="22">516</text>
  </g>
  <text x="40" y="166" font-family="Georgia, serif" font-size="14" fill="#2b2540">Why pages are not indexed</text>
  <line x1="40" y1="176" x2="600" y2="176" stroke="#2b2540" stroke-opacity="0.15"/>
  <g font-family="Georgia, serif" font-size="13" fill="#2b2540">
    <text x="40" y="200">Excluded by noindex tag</text>
    <text x="560" y="200" text-anchor="end">212</text>
    <text x="40" y="228">Duplicate without user-selected canonical</text>
    <text x="560" y="228" text-anchor="end">138</text>
    <text x="40" y="256">Page with redirect</text>
    <text x="560" y="256" text-anchor="end">97</text>
    <text x="40" y="284">Not found (404)</text>
    <text x="560" y="284" text-anchor="end">69</text>
  </g>
  <rect x="40" y="304" width="400" height="56" rx="6" fill="#f7f4ee"/>
  <g font-family="Georgia, serif" font-size="12" fill="#2b2540">
    <text x="52" y="326">/blog/page/9/</text>
    <text x="52" y="346">/blog/tag/news/?sort=new</text>
  </g>
  <g fill="#5b45d6">
    <circle cx="412" cy="88" r="14"/>
    <circle cx="590" cy="166" r="14"/>
    <circle cx="460" cy="332" r="14"/>
  </g>
  <g font-family="Georgia, serif" font-size="14" fill="#ffffff" text-anchor="middle">
    <text x="412" y="93">1</text>
    <text x="590" y="171">2</text>
    <text x="460" y="337">3</text>
  </g>
  <g font-family="Georgia, serif" font-size="12" fill="#5b45d6">
    <text x="432" y="93">Totals: watch the trend</text>
    <text x="480" y="337">Open samples to diagnose</text>
  </g>
</svg>
