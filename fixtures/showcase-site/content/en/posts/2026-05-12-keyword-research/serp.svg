<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t">
  <title id="t">A made-up results page for the search cold room temperature log, with five numbered labels: a short answer box, a box of related questions, small sites in the top results, old dates on those results, and related searches at the foot</title>
