    <rect x="262" y="244" width="17.5" height="26" rx="4"/>
    <rect x="262" y="290" width="6.3" height="26" rx="4"/>
  </g>
  <g font-family="Georgia, serif" font-size="13" fill="#2b2540">
    <text x="570" y="78">2,400</text>
