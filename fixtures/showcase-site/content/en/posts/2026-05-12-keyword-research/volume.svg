    <text x="250" y="78">temperature sensor</text>
    <text x="250" y="124">HACCP temperature records</text>
    <text x="250" y="170">cold room temperature log</text>
    <text x="250" y="216">fridge temperature alarm</text>
    <text x="250" y="262">walk-in fridge temperature sensor</text>
    <text x="250" y="308">wireless fridge thermometer...</text>
  </g>
  <g fill="#6b5ca5">
    <rect x="262" y="60" width="300" height="26" rx="4"/>
    <rect x="262" y="106" width="60" height="26" rx="4"/>
    <rect x="262" y="198" width="32.5" height="26" rx="4"/>
  </g>
  <g fill="#5b45d6">
