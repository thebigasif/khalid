    <text x="310" y="170">320</text>
    <text x="302" y="216">260</text>
    <text x="288" y="262">140</text>
    <text x="276" y="308">50</text>
  </g>
  <g fill="#ffb38a">
    <circle cx="360" cy="165" r="7"/>
    <circle cx="346" cy="257" r="7"/>
    <circle cx="334" cy="303" r="7"/>
  </g>
  <circle cx="276" cy="341" r="7" fill="#ffb38a"/>
  <text x="290" y="346" font-family="Georgia, serif" font-size="12" fill="#2b2540">best fit for what the example company sells</text>
