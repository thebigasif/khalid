<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t">
  <title id="t">Example data: one tool's estimated monthly searches for six phrases. Temperature sensor 2,400; HACCP temperature records 480; cold room temperature log 320; fridge temperature alarm 260; walk-in fridge temperature sensor 140; wireless fridge thermometer for restaurants 50. The three best-fit phrases for the example company are marked</title>
  <rect width="640" height="360" fill="#f7f4ee"/>
  <text x="320" y="32" font-family="Georgia, serif" font-size="17" text-anchor="middle" fill="#2b2540">Example data: monthly search estimates in one tool</text>
