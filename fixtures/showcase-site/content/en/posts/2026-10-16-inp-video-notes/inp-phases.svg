<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t">
  <title id="t">Diagram of one interaction: a tap, then input delay, processing time and presentation delay in a row, ending at the next paint. Together they make the interaction's INP time.</title>
  <rect width="640" height="360" fill="#f7f4ee"/>
  <text x="320" y="40" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="#2b2540">The three phases of one interaction</text>
  <line x1="60" y1="230" x2="590" y2="230" stroke="#2b2540" stroke-width="3"/>
  <rect x="80" y="160" width="150" height="50" rx="6" fill="#ffb38a"/>
  <rect x="230" y="160" width="200" height="50" rx="6" fill="#6b5ca5"/>
  <rect x="430" y="160" width="130" height="50" rx="6" fill="#8fd9bd"/>
  <circle cx="80" cy="230" r="8" fill="#5b45d6"/>
  <circle cx="560" cy="230" r="8" fill="#5b45d6"/>
  <g font-family="Georgia, serif" font-size="15" text-anchor="middle" fill="#2b2540">
    <text x="155" y="150">Input delay</text>
    <text x="330" y="150">Processing time</text>
    <text x="495" y="150">Presentation delay</text>
    <text x="80" y="260">Tap</text>
    <text x="560" y="260">Next paint</text>
  </g>
  <g font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#2b2540">
    <text x="155" y="105">Main thread busy</text>
    <text x="330" y="105">Your event code runs</text>
    <text x="495" y="105">Layout and paint</text>
  </g>
  <path d="M80 290 V300 H560 V290" fill="none" stroke="#5b45d6" stroke-width="3"/>
  <text x="320" y="325" font-family="Georgia, serif" font-size="16" text-anchor="middle" fill="#2b2540">All three together: the time INP counts for this tap</text>
</svg>
