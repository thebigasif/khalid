<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t">
  <title id="t">Mock verification screen for a domain property: a TXT record in a box with a Copy button, a note to add it at your DNS host, and a Verify button, marked 1, 2 and 3</title>
  <rect width="640" height="360" fill="#f7f4ee"/>
  <rect x="60" y="24" width="520" height="312" rx="10" fill="#ffffff" stroke="#2b2540" stroke-opacity="0.2"/>
  <text x="84" y="62" font-family="Georgia, serif" font-size="18" fill="#2b2540">Verify domain ownership via DNS record</text>
  <text x="84" y="90" font-family="Georgia, serif" font-size="13" fill="#2b2540" opacity="0.8">example.com</text>
  <text x="84" y="128" font-family="Georgia, serif" font-size="13" fill="#2b2540">Copy the TXT record below into the DNS settings for example.com</text>
  <rect x="84" y="142" width="380" height="36" rx="4" fill="#f7f4ee" stroke="#6b5ca5"/>
  <text x="96" y="165" font-family="Georgia, serif" font-size="13" fill="#2b2540">google-site-verification=EXAMPLE-ONLY</text>
  <rect x="472" y="142" width="70" height="36" rx="4" fill="#6b5ca5"/>
  <text x="507" y="165" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#ffffff">Copy</text>
  <text x="84" y="214" font-family="Georgia, serif" font-size="13" fill="#2b2540">Add the record at your DNS host, then come back.</text>
  <text x="84" y="236" font-family="Georgia, serif" font-size="13" fill="#2b2540">Changes can take a while to spread.</text>
  <rect x="452" y="282" width="100" height="36" rx="18" fill="#5b45d6"/>
  <text x="502" y="305" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#ffffff">Verify</text>
  <g font-family="Georgia, serif" font-size="14" text-anchor="middle">
    <circle cx="560" cy="160" r="14" fill="#ffb38a"/>
    <text x="560" y="165" fill="#2b2540">1</text>
    <circle cx="420" cy="220" r="14" fill="#ffb38a"/>
    <text x="420" y="225" fill="#2b2540">2</text>
    <circle cx="570" cy="300" r="14" fill="#ffb38a"/>
    <text x="570" y="305" fill="#2b2540">3</text>
  </g>
  <text x="84" y="305" font-family="Georgia, serif" font-size="11" fill="#2b2540" opacity="0.7">Mock screen. The record shown is a placeholder.</text>
</svg>
