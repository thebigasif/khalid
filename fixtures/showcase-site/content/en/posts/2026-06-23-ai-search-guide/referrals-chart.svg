<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t">
  <title id="t">Example data bar chart of monthly visits from AI tools to one small blog: June 40, July 65, August 90, September 120, October 180</title>
  <rect width="640" height="360" fill="#f7f4ee"/>
  <text x="320" y="34" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="#2b2540">Example data: visits from AI tools per month, one blog</text>
  <g stroke="#2b2540" stroke-opacity="0.15">
    <line x1="80" y1="300" x2="600" y2="300"/>
    <line x1="80" y1="240" x2="600" y2="240"/>
    <line x1="80" y1="180" x2="600" y2="180"/>
    <line x1="80" y1="120" x2="600" y2="120"/>
  </g>
  <g font-family="Georgia, serif" font-size="13" fill="#2b2540" text-anchor="end">
    <text x="70" y="304">0</text>
    <text x="70" y="244">50</text>
    <text x="70" y="184">100</text>
    <text x="70" y="124">150</text>
  </g>
  <g fill="#6b5ca5">
    <rect x="110" y="252" width="60" height="48" rx="4"/>
    <rect x="210" y="222" width="60" height="78" rx="4"/>
    <rect x="310" y="192" width="60" height="108" rx="4"/>
    <rect x="410" y="156" width="60" height="144" rx="4"/>
  </g>
  <rect x="510" y="84" width="60" height="216" rx="4" fill="#5b45d6"/>
  <g font-family="Georgia, serif" font-size="14" fill="#2b2540" text-anchor="middle">
    <text x="140" y="244">40</text>
    <text x="240" y="214">65</text>
    <text x="340" y="184">90</text>
    <text x="440" y="148">120</text>
    <text x="540" y="76">180</text>
    <text x="140" y="324">June</text>
    <text x="240" y="324">July</text>
    <text x="340" y="324">August</text>
    <text x="440" y="324">September</text>
    <text x="540" y="324">October</text>
  </g>
</svg>
