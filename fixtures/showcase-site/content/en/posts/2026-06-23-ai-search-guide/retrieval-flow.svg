<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t">
  <title id="t">Flow diagram of an AI answer: one question fans out into three searches, each search reads the search index, the best passages are chosen, and an answer is written that cites two pages</title>
  <rect width="640" height="380" fill="#f7f4ee"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6b5ca5"/>
    </marker>
  </defs>
  <g stroke="#6b5ca5" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M140 190 L178 90"/>
    <path d="M140 190 L178 190"/>
    <path d="M140 190 L178 290"/>
    <path d="M318 90 L360 170"/>
    <path d="M318 190 L360 190"/>
    <path d="M318 290 L360 210"/>
    <path d="M460 190 L488 190"/>
  </g>
  <rect x="20" y="160" width="120" height="60" rx="10" fill="#5b45d6"/>
  <g fill="#ffffff" stroke="#6b5ca5" stroke-width="2">
    <rect x="180" y="66" width="138" height="48" rx="10"/>
    <rect x="180" y="166" width="138" height="48" rx="10"/>
    <rect x="180" y="266" width="138" height="48" rx="10"/>
  </g>
  <rect x="362" y="150" width="98" height="80" rx="10" fill="#8fd9bd"/>
  <rect x="490" y="130" width="130" height="120" rx="10" fill="#ffffff" stroke="#5b45d6" stroke-width="3"/>
  <rect x="505" y="205" width="40" height="22" rx="11" fill="#ffb38a"/>
  <rect x="555" y="205" width="40" height="22" rx="11" fill="#ffb38a"/>
  <g font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#2b2540">
    <text x="320" y="32" font-size="17">From one question to a cited answer</text>
    <text x="80" y="187" fill="#ffffff">One</text>
    <text x="80" y="205" fill="#ffffff">question</text>
    <text x="249" y="95">Search: part A</text>
    <text x="249" y="195">Search: part B</text>
    <text x="249" y="295">Search: part C</text>
    <text x="411" y="186">Index and</text>
    <text x="411" y="204">passages</text>
    <text x="555" y="162">Answer</text>
    <text x="555" y="182">written</text>
    <text x="525" y="221" font-size="12">[1]</text>
    <text x="575" y="221" font-size="12">[2]</text>
    <text x="249" y="345">Query fan-out</text>
    <text x="555" y="275">Cited sources</text>
  </g>
</svg>
