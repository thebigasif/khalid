<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t">
  <title id="t">Eine Seite lädt von links nach rechts: erst der leere Bildschirm, dann der Text, dann das größte Bild, das den Largest Contentful Paint markiert</title>
  <rect width="640" height="300" fill="#f7f4ee"/>
  <line x1="40" y1="250" x2="600" y2="250" stroke="#2b2540" stroke-width="3"/>
  <g fill="#ffffff" stroke="#6b5ca5" stroke-width="3">
    <rect x="50" y="60" width="140" height="160" rx="8"/>
    <rect x="250" y="60" width="140" height="160" rx="8"/>
    <rect x="450" y="60" width="140" height="160" rx="8"/>
  </g>
  <g fill="#c9c1e3">
    <rect x="265" y="80" width="110" height="10" rx="3"/>
    <rect x="265" y="100" width="90" height="10" rx="3"/>
    <rect x="265" y="120" width="100" height="10" rx="3"/>
    <rect x="465" y="80" width="110" height="10" rx="3"/>
    <rect x="465" y="100" width="90" height="10" rx="3"/>
  </g>
  <rect x="465" y="125" width="110" height="80" rx="4" fill="#6b5ca5"/>
  <g fill="#2b2540">
    <circle cx="120" cy="250" r="7"/>
    <circle cx="320" cy="250" r="7"/>
    <circle cx="520" cy="250" r="7"/>
  </g>
  <g font-family="Georgia, serif" font-size="16" text-anchor="middle" fill="#2b2540">
    <text x="120" y="280">Leerer Bildschirm</text>
    <text x="320" y="280">Text erscheint</text>
    <text x="520" y="280">Größtes Element</text>
  </g>
  <text x="320" y="38" font-family="Georgia, serif" font-size="18" text-anchor="middle" fill="#2b2540">So lädt eine Seite aus Sicht des Lesers</text>
</svg>
