<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t">
  <title id="t">Mock screenshot of Quillmeter: a draft with one long sentence marked in peach and a side panel that says Long sentence, 31 words</title>
  <rect width="640" height="360" fill="#f7f4ee"/>
  <rect x="20" y="20" width="600" height="320" rx="10" fill="#ffffff" stroke="#2b2540" stroke-opacity="0.2"/>
  <rect x="20" y="20" width="600" height="34" rx="10" fill="#6b5ca5"/>
  <circle cx="40" cy="37" r="5" fill="#ffffff"/>
  <circle cx="56" cy="37" r="5" fill="#ffffff" opacity="0.6"/>
  <text x="320" y="42" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#ffffff">Quillmeter: client-guide-draft.txt</text>
  <g font-family="Georgia, serif" font-size="13" fill="#2b2540">
    <text x="40" y="88">A good guide answers the question first.</text>
    <text x="40" y="112">Then it shows the steps in order.</text>
    <rect x="36" y="124" width="380" height="64" rx="4" fill="#ffb38a" opacity="0.55"/>
    <text x="40" y="142">When you plan a post you should always think about</text>
    <text x="40" y="162">who will read it and what they already know and what</text>
    <text x="40" y="182">they need to do next once they have finished reading.</text>
    <text x="40" y="214">Keep each sentence to one idea.</text>
    <text x="40" y="238">Your reader will thank you for it.</text>
  </g>
  <rect x="440" y="70" width="160" height="250" rx="6" fill="#f7f4ee"/>
  <text x="452" y="94" font-family="Georgia, serif" font-size="13" fill="#2b2540" font-weight="bold">Marks: 1</text>
  <rect x="452" y="108" width="136" height="70" rx="6" fill="#ffffff" stroke="#ffb38a" stroke-width="2"/>
  <text x="462" y="130" font-family="Georgia, serif" font-size="13" fill="#2b2540">Long sentence</text>
  <text x="462" y="152" font-family="Georgia, serif" font-size="13" fill="#2b2540">31 words</text>
  <text x="462" y="170" font-family="Georgia, serif" font-size="11" fill="#2b2540" opacity="0.7">Your limit: 25</text>
  <circle cx="424" cy="132" r="13" fill="#5b45d6"/>
  <text x="424" y="137" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#ffffff">1</text>
  <text x="40" y="300" font-family="Georgia, serif" font-size="12" fill="#2b2540" opacity="0.75">1. The mark shows where a reader may stall. Quillmeter suggests no rewrite.</text>
</svg>
