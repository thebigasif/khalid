# The sample brand for the Casper demo: a personal blog in Casper's first
# colours. White paper, near-black ink, cool grey lines and one sky blue
# accent for the cover, the header bar and the buttons. The system's sans
# for titles and Georgia for a post's text, as Casper sets them, so the
# brand needs no font files. Only the brand lives here: the template keeps
# its own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#f4f6f8"
text = "#15171a"
muted = "#5b6770"
link = "#1468a3"
accent = "#1672b0"
border = "#e3e8ec"

[fonts]
heading = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Fira Sans\", \"Droid Sans\", \"Helvetica Neue\", sans-serif"
body = "Lora, Georgia, Times, serif"
mono = "Menlo, Courier, monospace"

# Lora is self-hosted, so every browser draws the post text in the same
# serif and a line holds the same number of characters everywhere.
[[fonts.files]]
family = "Lora"
style = "normal"
weight = "400 700"
path = "lora-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "63.43%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
