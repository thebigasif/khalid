# The sample brand for the Quill demo: Small Hours, one writer's journal.
# Oxblood ink on warm paper, and Lora for every word: one variable file
# for the roman and one for the italic. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#fbf8f1"
surface = "#f2ece0"
text = "#221f1b"
muted = "#5f574d"
link = "#7a2e1f"
accent = "#7a2e1f"
border = "#e4dccd"

[fonts]
heading = "Lora, Charter, \"Iowan Old Style\", Georgia, serif"
body = "Lora, Charter, \"Iowan Old Style\", Georgia, serif"

[[fonts.files]]
family = "Lora"
style = "normal"
weight = "400 600"
path = "lora-latin-400-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "63.43%"

[[fonts.files]]
family = "Lora"
style = "italic"
weight = "400"
path = "lora-latin-italic-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "62.37%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
