# The sample brand for the Quill demo: Small Hours, one writer's journal.
# Oxblood ink on warm paper, and Lora for every word: one variable file
# for the roman and one for the italic. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#fbf8f1"
surface = "#f2ece0"
text = "#221f1b"
muted = "#5f574d"
link = "#7a2e1f"
accent = "#7a2e1f"
border = "#e4dccd"

[fonts]
heading = "\"Showcase Serif\", Charter, \"Iowan Old Style\", Georgia, serif"
body = "\"Showcase Serif\", Charter, \"Iowan Old Style\", Georgia, serif"

[[fonts.files]]
family = "Showcase Serif"
style = "normal"
weight = "400 600"
path = "lora-latin-400-600.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "63.43%"

[[fonts.files]]
family = "Showcase Serif"
style = "italic"
weight = "400"
path = "lora-latin-italic-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "62.37%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
