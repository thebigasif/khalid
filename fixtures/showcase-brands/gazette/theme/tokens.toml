# The sample brand for the Gazette demo: The Marlbeck Courier, the
# made-up paper of a made-up market town. A deep green on white with a
# pale sage surface, Domine for headlines and Mulish for the text, labels
# and section flags. Only the brand lives here: the template keeps its
# own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#eef2ec"
text = "#16181c"
muted = "#52564f"
link = "#17603e"
accent = "#17603e"
border = "#dde3da"

[fonts]
heading = "Domine, Georgia, \"Times New Roman\", serif"
body = "Mulish, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Domine"
style = "normal"
weight = "700"
path = "domine-latin-700.woff2"
range = "U+0020-007E, U+00A0, U+00A3, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "99.42%"
descent = "113.25%"
line_gap = "0.00%"
size_adjust = "64.38%"

[[fonts.files]]
family = "Mulish"
style = "normal"
weight = "400"
path = "mulish-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A3, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "111.02%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "63.01%"

[[fonts.files]]
family = "Mulish"
style = "normal"
weight = "700"
path = "mulish-latin-700.woff2"
range = "U+0020-007E, U+00A0, U+00A3, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "111.02%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "64.60%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
