# The sample brand for the Fixture demo: Larkmoor Rovers, a made-up
# amateur football club. Deep navy on white with a warm chalk surface,
# Oswald for names and scores like a scoreboard, and Archivo for the
# text. Only the brand lives here: the template keeps its own shape,
# type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#f5f1e6"
text = "#141824"
muted = "#555b66"
link = "#1c2d5a"
accent = "#1c2d5a"
border = "#ddd6c4"

[fonts]
heading = "Oswald, \"Arial Narrow\", \"Roboto Condensed\", Arial, sans-serif"
body = "Archivo, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Oswald"
style = "normal"
weight = "600"
path = "oswald-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "131.78%"
descent = "136.38%"
line_gap = "0.00%"
size_adjust = "53.69%"

[[fonts.files]]
family = "Archivo"
style = "normal"
weight = "400"
path = "archivo-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "96.99%"
descent = "99.10%"
line_gap = "0.00%"
size_adjust = "59.20%"

[[fonts.files]]
family = "Archivo"
style = "normal"
weight = "600"
path = "archivo-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
