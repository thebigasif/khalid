# The sample brand for the Solo demo: one writer's personal site. Ink on
# warm paper, the way Solo looks with its background colour set, a heavy
# geometric sans for headings, a quieter geometric sans for text, and
# links in a burnt orange. Only the brand lives here: the template
# keeps its own shape, type sizes and spacing.
[colors]
background = "#f6f3ee"
surface = "#ece7df"
text = "#1b1a17"
muted = "#5f5a52"
link = "#8f3a17"
accent = "#1b1a17"
border = "#ddd6cb"

[fonts]
heading = "Manrope, system-ui, -apple-system, \"Segoe UI\", sans-serif"
body = "\"DM Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Manrope"
style = "normal"
weight = "600 700"
path = "manrope-latin-600-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "117.75%"
descent = "141.57%"
line_gap = "0.00%"
size_adjust = "59.88%"

[[fonts.files]]
family = "DM Sans"
style = "normal"
weight = "400 700"
path = "dm-sans-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "109.58%"
descent = "146.29%"
line_gap = "0.00%"
size_adjust = "57.18%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
