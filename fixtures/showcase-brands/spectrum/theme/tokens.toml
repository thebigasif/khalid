# The sample brand for the Spectrum demo: Kite, a magazine of good ideas.
# Ink on white with a warm paper surface and a brick red accent, which
# starts the spectrum of topic colours in red. Schibsted Grotesk for titles
# and labels, Petrona for the text. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#f6f2ea"
text = "#1a1714"
muted = "#5b544c"
link = "#a8321c"
accent = "#a8321c"
border = "#e3dccf"

[fonts]
heading = "\"Schibsted Grotesk\", \"Helvetica Neue\", Arial, sans-serif"
body = "Petrona, Charter, Georgia, serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Schibsted Grotesk"
style = "normal"
weight = "700"
path = "schibsted-grotesk-latin-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "107.87%"
descent = "121.66%"
line_gap = "0.00%"
size_adjust = "64.94%"

[[fonts.files]]
family = "Petrona"
style = "normal"
weight = "400 700"
path = "petrona-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "94.78%"
descent = "127.41%"
line_gap = "0.00%"
size_adjust = "57.61%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
