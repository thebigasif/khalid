# The sample brand for the Journal demo: one writer's weekly letter, kept
# on the blog as a journal. Warm paper, soft black ink and one cobalt
# accent that fills the sign-up band. Lora for the large titles, as
# Ghost's "elegant serif" title setting, and Inter for the letters, the
# labels and the side column. Only the brand lives here: the template
# keeps its own shape, type sizes and spacing.
[colors]
background = "#fffdf8"
surface = "#f4f0e7"
text = "#1b1a17"
muted = "#5d574e"
link = "#2440b3"
accent = "#2a4bd2"
border = "#e6e0d3"

[fonts]
heading = "Lora, \"Iowan Old Style\", Charter, Georgia, serif"
body = "Inter, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Lora"
style = "normal"
weight = "400 700"
path = "lora-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "63.43%"

[[fonts.files]]
family = "Inter"
style = "normal"
weight = "400 600"
path = "inter-latin-400-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "107.01%"
descent = "113.82%"
line_gap = "0.00%"
size_adjust = "64.63%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
