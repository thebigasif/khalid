# The sample brand for the Headline demo: a local news site. White paper,
# near-black ink, a warm grey field for the tags and boxes and one deep
# news red for buttons, the topic over each title and links, with Inter
# for headings, menus and labels and Lora for summaries and posts, as
# Headline sets them. Only the brand lives here: the template keeps its
# own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#f4f2ef"
text = "#16181b"
muted = "#5d5f63"
link = "#a8102a"
accent = "#c8102e"
border = "#e4e1dc"

[fonts]
heading = "Inter, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
body = "Lora, Georgia, \"Times New Roman\", serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Inter"
style = "normal"
weight = "400 800"
path = "inter-latin-400-800.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "107.01%"
descent = "113.82%"
line_gap = "0.00%"
size_adjust = "64.63%"

[[fonts.files]]
family = "Lora"
style = "normal"
weight = "400 700"
path = "lora-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "63.43%"

[[fonts.files]]
family = "Lora"
style = "italic"
weight = "400"
path = "lora-latin-italic-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "56.76%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
