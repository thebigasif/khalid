# The sample brand for the Mosaic demo: Dry Light, a photo blog of the
# desert Southwest. A sand white page, warm near-black ink and one dusk
# indigo for the small squares that mark each caption. Familjen Grotesk
# for titles, a grotesque with a little warmth, and Albert Sans for the
# words. Only the brand lives here: the template keeps its own shape,
# type sizes and spacing.
[colors]
background = "#fbf8f3"
surface = "#f1eadf"
text = "#231e19"
muted = "#655b50"
link = "#3c3f8c"
accent = "#3c3f8c"
border = "#e2d9cb"

[fonts]
heading = "\"Familjen Grotesk\", \"Helvetica Neue\", Arial, sans-serif"
body = "\"Albert Sans\", \"Helvetica Neue\", Arial, sans-serif"

[[fonts.files]]
family = "Familjen Grotesk"
style = "normal"
weight = "600"
path = "familjen-grotesk-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "113.23%"
descent = "106.18%"
line_gap = "0.00%"
size_adjust = "58.51%"

[[fonts.files]]
family = "Albert Sans"
style = "normal"
weight = "400"
path = "albert-sans-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "104.94%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "58.88%"

[[fonts.files]]
family = "Albert Sans"
style = "normal"
weight = "600"
path = "albert-sans-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "104.94%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "60.25%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
