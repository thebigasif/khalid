# The sample brand for the Ledger demo: a research group that publishes
# studies. Petrol blue-green on near white, a strong gothic sans for
# headings and a sturdy text serif for long reports. Only the brand lives
# here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#fdfdfc"
surface = "#f3f5f4"
text = "#161c1d"
muted = "#525c5e"
link = "#0d5c66"
accent = "#0f6c78"
border = "#d6dcdc"

[fonts]
heading = "\"Libre Franklin\", \"Franklin Gothic Medium\", system-ui, sans-serif"
body = "\"PT Serif\", Charter, Georgia, serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Libre Franklin"
style = "normal"
weight = "600 800"
path = "libre-franklin-latin-600-800.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "106.71%"
descent = "116.08%"
line_gap = "0.00%"
size_adjust = "62.37%"

[[fonts.files]]
family = "PT Serif"
style = "italic"
weight = "400"
path = "pt-serif-latin-italic-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
