# The sample brand for the Ledger demo: a research group that publishes
# studies. Petrol blue-green on near white, a strong gothic sans for
# headings and a sturdy text serif for long reports. Only the brand lives
# here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#fdfdfc"
surface = "#f3f5f4"
text = "#161c1d"
muted = "#525c5e"
link = "#0d5c66"
accent = "#0f6c78"
border = "#d6dcdc"

[fonts]
heading = "\"Libre Franklin\", \"Franklin Gothic Medium\", system-ui, sans-serif"
body = "\"Ledger Serif\", Charter, Georgia, serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Libre Franklin"
style = "normal"
weight = "600 800"
path = "libre-franklin-latin-600-800.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E1, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "106.71%"
descent = "116.08%"
line_gap = "0.00%"
size_adjust = "62.37%"

[[fonts.files]]
family = "Ledger Serif"
style = "italic"
weight = "400"
path = "pt-serif-latin-italic-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E1, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
