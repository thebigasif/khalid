# The sample brand for the Ruby demo: a picture-led magazine. A page that
# fades to a warm light grey, dark grey ink and one deep ruby red for the
# topic labels, links and buttons. The system's sans for everything, as
# Ruby's "Modern sans-serif" setting, so the brand needs no font files.
# Only the brand lives here: the template keeps its own shape, type sizes
# and spacing.
[colors]
background = "#ffffff"
surface = "#f1eeee"
text = "#2b2b2b"
muted = "#666666"
link = "#a10f38"
accent = "#b3123f"
border = "#e9e4e4"

[fonts]
heading = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif"
body = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
