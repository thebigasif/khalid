# The sample brand for the Edge demo: a small photo studio that shows its
# work first. Ink on white with a warm grey for tiles and panels, links in
# a deep fern green, and one modern sans, Inter, for everything. Only the
# brand lives here: the template keeps its own shape, type sizes and
# spacing.
[colors]
background = "#ffffff"
surface = "#f4f3f1"
text = "#161616"
muted = "#5c5a57"
link = "#2f4a3a"
accent = "#161616"
border = "#e4e2de"

[fonts]
heading = "Inter, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
body = "Inter, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Inter"
style = "normal"
weight = "400 600"
path = "inter-latin-400-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "107.01%"
descent = "113.82%"
line_gap = "0.00%"
size_adjust = "64.63%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
