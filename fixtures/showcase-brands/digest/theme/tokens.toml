# The sample brand for the Digest demo: a weekly email digest of SEO
# writing news that keeps every issue on its blog. A clear cobalt for
# labels, rules and the subscribe button, cool grey panels, near-black
# ink, and Raleway for everything, headings set heavy, as Ghost's Digest
# sets one sans throughout. Only the brand lives here: the template
# keeps its own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#f3f4f7"
text = "#14161c"
muted = "#5a5f6b"
link = "#2340bd"
accent = "#2747d4"
border = "#e2e4ea"

[fonts]
heading = "Raleway, system-ui, -apple-system, \"Segoe UI\", sans-serif"
body = "Raleway, system-ui, -apple-system, \"Segoe UI\", sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Raleway"
style = "normal"
weight = "400 800"
path = "raleway-latin-400-800.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "103.84%"
descent = "110.42%"
line_gap = "0.00%"
size_adjust = "59.94%"

[[fonts.files]]
family = "Raleway"
style = "italic"
weight = "400 700"
path = "raleway-latin-italic-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "103.84%"
descent = "110.42%"
line_gap = "0.00%"
size_adjust = "58.24%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
