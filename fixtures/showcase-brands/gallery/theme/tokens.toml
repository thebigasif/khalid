# The sample brand for the Gallery demo: Fernbrook Press, a print and
# restoration studio. A cool plaster wall, pale mats, near-black ink and
# one deep ultramarine like a cyanotype. Syne for the studio's name and
# the titles, a wide grotesque with character, and Albert Sans for the
# text and labels. Only the brand lives here: the template keeps its own
# shape, type sizes and spacing.
[colors]
background = "#ebe9e4"
surface = "#fafaf8"
text = "#17181c"
muted = "#50535b"
link = "#2b3f8f"
accent = "#2b3f8f"
border = "#d2d1cb"

[fonts]
heading = "Syne, \"Avenir Next\", Arial, sans-serif"
body = "\"Albert Sans\", \"Helvetica Neue\", Arial, sans-serif"

[[fonts.files]]
family = "Syne"
style = "normal"
weight = "700"
path = "syne-latin-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "102.18%"
descent = "129.77%"
line_gap = "0.00%"
size_adjust = "72.43%"

[[fonts.files]]
family = "Albert Sans"
style = "normal"
weight = "400"
path = "albert-sans-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "104.94%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "58.88%"

[[fonts.files]]
family = "Albert Sans"
style = "normal"
weight = "600"
path = "albert-sans-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "104.94%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "60.25%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
