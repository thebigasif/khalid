# The sample brand for the Gallery demo: Fernbrook Press, a print and
# restoration studio. A cool plaster wall, pale mats, near-black ink and
# one deep ultramarine like a cyanotype. Syne for the studio's name and
# the titles, a wide grotesque with character, and Albert Sans for the
# text and labels. Only the brand lives here: the template keeps its own
# shape, type sizes and spacing.
[colors]
background = "#ebe9e4"
surface = "#fafaf8"
text = "#17181c"
muted = "#50535b"
link = "#2b3f8f"
accent = "#2b3f8f"
border = "#d2d1cb"

[fonts]
heading = "Syne, \"Avenir Next\", Arial, sans-serif"
body = "\"Albert Sans\", \"Helvetica Neue\", Arial, sans-serif"

[[fonts.files]]
family = "Syne"
style = "normal"
weight = "700"
path = "syne-latin-700.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E0, U+00E9, U+00ED, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "102.18%"
descent = "129.77%"
line_gap = "0.00%"
size_adjust = "72.43%"

[[fonts.files]]
family = "Albert Sans"
style = "normal"
weight = "400"
path = "albert-sans-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E0, U+00E9, U+00ED, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "104.94%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "58.88%"

[[fonts.files]]
family = "Albert Sans"
style = "normal"
weight = "600"
path = "albert-sans-latin-600.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E0, U+00E9, U+00ED, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
