# The sample brand for the Dawn demo: a calm morning letter about writing
# for search. A clear early-sky blue for the date blocks and buttons on
# white, a pale blue-grey field, and one open geometric sans, Mulish, for
# headings and text, as Dawn sets it. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#f3f5fa"
text = "#1b1f2a"
muted = "#5c6273"
link = "#2f4db3"
accent = "#3d5bd9"
border = "#e2e6ef"

[fonts]
heading = "Mulish, system-ui, -apple-system, \"Segoe UI\", sans-serif"
body = "Mulish, system-ui, -apple-system, \"Segoe UI\", sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Mulish"
style = "normal"
weight = "400 800"
path = "mulish-latin-400-800.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.02%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "61.52%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
