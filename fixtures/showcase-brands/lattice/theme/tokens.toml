# The sample brand for the Lattice demo: Wavelength, a science explainer
# site. Indigo on white with a pale lilac surface for the figure mats,
# Hanken Grotesk for titles, Gelasio for the reading column and DM Mono
# for figure numbers and key numbers. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#f1f1fa"
text = "#16172b"
muted = "#4c4e66"
link = "#3b3fb6"
accent = "#3b3fb6"
border = "#d6d7ea"

[fonts]
heading = "\"Hanken Grotesk\", \"Helvetica Neue\", Arial, sans-serif"
body = "Gelasio, Georgia, Cambria, serif"
mono = "\"DM Mono\", ui-monospace, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Hanken Grotesk"
style = "normal"
weight = "700"
path = "hanken-grotesk-latin-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "110.46%"
descent = "142.98%"
line_gap = "0.00%"
size_adjust = "58.88%"

[[fonts.files]]
family = "Gelasio"
style = "normal"
weight = "400"
path = "gelasio-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
