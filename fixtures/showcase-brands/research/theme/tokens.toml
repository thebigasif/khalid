# The sample brand for the Research demo: a coastal ecology lab at a
# university. Deep sea blue on white with a pale sea surface, Literata
# for titles like a printed paper and Fira Sans for the text. Only the
# brand lives here: the template keeps its own shape, type sizes and
# spacing.
[colors]
background = "#ffffff"
surface = "#eef4f6"
text = "#13212b"
muted = "#4a5a64"
link = "#0c5a78"
accent = "#0c5a78"
border = "#cfdee4"

[fonts]
heading = "Literata, Charter, Georgia, serif"
body = "\"Fira Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Literata"
style = "normal"
weight = "600"
path = "literata-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "130.02%"
descent = "145.34%"
line_gap = "0.00%"
size_adjust = "69.26%"

[[fonts.files]]
family = "Fira Sans"
style = "normal"
weight = "400"
path = "fira-sans-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "103.28%"
descent = "125.05%"
line_gap = "0.00%"
size_adjust = "59.09%"

[[fonts.files]]
family = "Fira Sans"
style = "normal"
weight = "600"
path = "fira-sans-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "103.28%"
descent = "125.05%"
line_gap = "0.00%"
size_adjust = "60.36%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
