# The sample brand for the Vital demo: Fernhill Wellbeing, a small
# movement and wellbeing studio. Warm clay on a cream page with a peach
# surface, Young Serif for titles and Figtree for the text. Only the
# brand lives here: the template keeps its own shape, type sizes and
# spacing.
[colors]
background = "#fffaf5"
surface = "#f8ebe0"
text = "#2a1f1a"
muted = "#5e4c43"
link = "#9a3f1f"
accent = "#9a3f1f"
border = "#ead8c9"

[fonts]
heading = "\"Young Serif\", Georgia, serif"
body = "Figtree, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"

[[fonts.files]]
family = "Young Serif"
style = "normal"
weight = "400"
path = "young-serif-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E1, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "115.55%"
descent = "172.71%"
line_gap = "0.00%"
size_adjust = "66.50%"

[[fonts.files]]
family = "Figtree"
style = "normal"
weight = "400 700"
path = "figtree-latin-400-700.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E1, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "104.94%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "56.76%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
