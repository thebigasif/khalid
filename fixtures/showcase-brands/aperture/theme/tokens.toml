# The sample brand for the Aperture demo: Northlight, a photo journal of
# the north. A cool white like snow light, near-black ink and one deep
# fjord blue. Newsreader for titles and text, a book face with an optical
# size made for screens, and JetBrains Mono for the camera details. Only
# the brand lives here: the template keeps its own shape, type sizes and
# spacing.
[colors]
background = "#fbfaf8"
surface = "#eff1f0"
text = "#171a1c"
muted = "#545b60"
link = "#1f5a73"
accent = "#1f5a73"
border = "#d9ddde"

[fonts]
heading = "Newsreader, Charter, Georgia, serif"
body = "Newsreader, Charter, Georgia, serif"
mono = "\"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Newsreader"
style = "normal"
weight = "400"
path = "newsreader-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "81.19%"
descent = "125.05%"
line_gap = "0.00%"
size_adjust = "59.51%"

[[fonts.files]]
family = "Newsreader"
style = "normal"
weight = "500"
path = "newsreader-latin-500.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "81.19%"
descent = "125.05%"
line_gap = "0.00%"
size_adjust = "61.31%"

[[fonts.files]]
family = "JetBrains Mono"
style = "normal"
weight = "400"
path = "jetbrains-mono-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "112.67%"
descent = "141.57%"
line_gap = "0.00%"
size_adjust = "63.75%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
