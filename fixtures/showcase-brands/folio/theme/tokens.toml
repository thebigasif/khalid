# The sample brand for the Folio demo: a product team that writes down
# how it works. Graphite ink, ruled warm grey panels and one gold accent,
# a tight display sans for headings and a neutral text sans. Only the
# brand lives here: the template keeps its own shape, type sizes and
# spacing.
[colors]
background = "#ffffff"
surface = "#f5f4f0"
text = "#111113"
muted = "#5d5d66"
link = "#755600"
accent = "#876400"
border = "#e2e0d9"

[fonts]
heading = "\"Inter Tight\", Inter, system-ui, -apple-system, \"Segoe UI\", sans-serif"
body = "Inter, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Inter Tight"
style = "normal"
weight = "600"
path = "inter-tight-latin-600.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "107.01%"
descent = "113.82%"
line_gap = "0.00%"
size_adjust = "62.05%"

[[fonts.files]]
family = "Inter"
style = "normal"
weight = "400 600"
path = "inter-latin-400-600.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "107.01%"
descent = "113.82%"
line_gap = "0.00%"
size_adjust = "64.63%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
