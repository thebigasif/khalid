# The sample brand for the Bulletin demo: a weekly email newsletter that
# also publishes every issue on its blog. A punchy tomato red that fills
# the sign-up panel, warm near-black ink, a heavy geometric sans for
# headings and a calm text serif for the issues. Only the brand lives
# here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#fbf3ef"
text = "#1a1614"
muted = "#645b56"
link = "#b02e16"
accent = "#c8361b"
border = "#efe2dc"

[fonts]
heading = "Mulish, system-ui, -apple-system, \"Segoe UI\", sans-serif"
body = "Lora, \"Iowan Old Style\", Charter, Georgia, serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Mulish"
style = "normal"
weight = "500 800"
path = "mulish-latin-500-800.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.02%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "61.52%"

[[fonts.files]]
family = "Lora"
style = "normal"
weight = "400 700"
path = "lora-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "63.43%"

[[fonts.files]]
family = "Lora"
style = "italic"
weight = "400"
path = "lora-latin-italic-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "56.76%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
