# The sample brand for the Meridian demo: a company that keeps a
# journal. Plum on warm ivory, a high-contrast display serif for headings
# and a clean sans for text. Only the brand lives here: the template keeps
# its own shape, type sizes and spacing.
[colors]
background = "#fbf8f5"
surface = "#f4eee9"
text = "#1f1a1c"
muted = "#62585c"
link = "#7b2d6a"
accent = "#8a3378"
border = "#e6dcd6"

[fonts]
heading = "\"DM Serif Display\", \"Iowan Old Style\", Georgia, serif"
body = "\"Work Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "DM Serif Display"
style = "normal"
weight = "400"
path = "dm-serif-display-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "114.44%"
descent = "158.08%"
line_gap = "0.00%"
size_adjust = "59.41%"

[[fonts.files]]
family = "Work Sans"
style = "normal"
weight = "400 600"
path = "work-sans-latin-400-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "102.73%"
descent = "114.67%"
line_gap = "0.00%"
size_adjust = "63.22%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
