# The sample brand for the Summit demo: a city summit on streets, transport
# and public space. Deep street green on white with a pale green surface,
# Archivo for titles like a poster and Figtree for the text. Only the
# brand lives here: the template keeps its own shape, type sizes and
# spacing.
[colors]
background = "#ffffff"
surface = "#eef5f1"
text = "#122019"
muted = "#4b5a52"
link = "#0d6b4f"
accent = "#0d6b4f"
border = "#cfe0d7"

[fonts]
heading = "Archivo, \"Avenir Next\", \"Segoe UI\", system-ui, sans-serif"
body = "Figtree, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Archivo"
style = "normal"
weight = "800"
path = "archivo-latin-800.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+00F3, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "96.99%"
descent = "99.10%"
line_gap = "0.00%"
size_adjust = "64.91%"

[[fonts.files]]
family = "Figtree"
style = "normal"
weight = "400 600"
path = "figtree-latin-400-600.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+00F3, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "104.94%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "56.76%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
