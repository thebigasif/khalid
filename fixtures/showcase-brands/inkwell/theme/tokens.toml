# The sample brand for the Inkwell demo: The Seed Tin, the quarterly
# letter of a seed library. A beetroot red on a warm paper, Vollkorn for
# titles and the issue numbers, and Mulish for the text. Only the brand
# lives here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#fcf9f3"
surface = "#f3ede1"
text = "#241c1f"
muted = "#584c4f"
link = "#7b2d43"
accent = "#7b2d43"
border = "#e2d8c8"

[fonts]
heading = "Vollkorn, Georgia, serif"
body = "Mulish, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"

[[fonts.files]]
family = "Vollkorn"
style = "normal"
weight = "600"
path = "vollkorn-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "105.16%"
descent = "208.10%"
line_gap = "0.00%"
size_adjust = "64.49%"

[[fonts.files]]
family = "Mulish"
style = "normal"
weight = "400 700"
path = "mulish-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.02%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "63.01%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
