# The sample brand for the Notebook demo: Maren Holt's garden notebook.
# Green-black ink and a deep leaf green on a pale sage page, Alegreya
# for the words and Courier Prime for the dates in the margin. Only the
# brand lives here: the template keeps its own shape, type sizes and
# spacing.
[colors]
background = "#f8f8f3"
surface = "#edefe4"
text = "#1d2320"
muted = "#515a54"
link = "#2b6a3e"
accent = "#2b6a3e"
border = "#d8dccd"

[fonts]
heading = "Alegreya, Palatino, \"Palatino Linotype\", Georgia, serif"
body = "Alegreya, Palatino, \"Palatino Linotype\", Georgia, serif"
mono = "\"Courier Prime\", \"Courier New\", ui-monospace, monospace"

[[fonts.files]]
family = "Alegreya"
style = "normal"
weight = "400"
path = "alegreya-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "112.23%"
descent = "162.80%"
line_gap = "0.00%"
size_adjust = "58.14%"

[[fonts.files]]
family = "Alegreya"
style = "italic"
weight = "400"
path = "alegreya-latin-400-italic.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
