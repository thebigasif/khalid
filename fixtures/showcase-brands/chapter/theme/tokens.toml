# The sample brand for the Chapter demo: a novelist from the Welsh
# border. Pine green on a pale paper, EB Garamond for titles, book titles
# and excerpts, and Alegreya Sans for the text. Only the brand lives
# here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#f9f6ef"
surface = "#efe9dc"
text = "#1f2422"
muted = "#4f5753"
link = "#2d5a4b"
accent = "#2d5a4b"
border = "#d9d1c1"

[fonts]
heading = "\"EB Garamond\", Garamond, Georgia, serif"
body = "\"Alegreya Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "EB Garamond"
style = "normal"
weight = "500"
path = "eb-garamond-latin-500.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.24%"
descent = "140.62%"
line_gap = "0.00%"
size_adjust = "57.39%"

[[fonts.files]]
family = "EB Garamond"
style = "italic"
weight = "400"
path = "eb-garamond-latin-italic-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.24%"
descent = "140.62%"
line_gap = "0.00%"
size_adjust = "55.59%"

[[fonts.files]]
family = "Alegreya Sans"
style = "normal"
weight = "400"
path = "alegreya-sans-latin-400.woff2"
