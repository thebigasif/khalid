# The sample brand for the Chapter demo: a novelist from the Welsh
# border. Pine green on a pale paper, EB Garamond for titles, book titles
# and excerpts, and Alegreya Sans for the text. Only the brand lives
# here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#f9f6ef"
surface = "#efe9dc"
text = "#1f2422"
muted = "#4f5753"
link = "#2d5a4b"
accent = "#2d5a4b"
border = "#d9d1c1"

[fonts]
heading = "\"EB Garamond\", Garamond, Georgia, serif"
body = "\"Alegreya Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "EB Garamond"
style = "normal"
weight = "500"
path = "eb-garamond-latin-500.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "111.24%"
descent = "140.62%"
line_gap = "0.00%"
size_adjust = "57.39%"

[[fonts.files]]
family = "EB Garamond"
style = "italic"
weight = "400"
path = "eb-garamond-latin-italic-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
