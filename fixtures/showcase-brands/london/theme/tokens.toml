# The sample brand for the London demo: a studio that shows its work in
# large pictures. Charcoal ink on plain paper, a warm stone surface and
# one burnt orange for links, so the photographs carry the colour. Mulish
# for everything, set heavy for titles, as London's own type. Only the
# brand lives here: the template keeps its own shape, type sizes and
# spacing.
[colors]
background = "#ffffff"
surface = "#f3f1ee"
text = "#161616"
muted = "#5d5a56"
link = "#9a3412"
accent = "#b8461b"
border = "#e4e0da"

[fonts]
heading = "Mulish, system-ui, -apple-system, \"Segoe UI\", sans-serif"
body = "Mulish, system-ui, -apple-system, \"Segoe UI\", sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Mulish"
style = "normal"
weight = "500 800"
path = "mulish-latin-500-800.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.02%"
descent = "117.97%"
line_gap = "0.00%"
size_adjust = "61.52%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
