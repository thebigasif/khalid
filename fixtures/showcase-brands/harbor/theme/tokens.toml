# The sample brand for the Harbor demo: a marketing team that publishes
# every day. Warm orange with peach panels, a round geometric sans for
# headings and a friendly sans for text. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#fff4ec"
text = "#1d1712"
muted = "#62574e"
link = "#b33a09"
accent = "#c9440b"
border = "#f2dccc"

[fonts]
heading = "Outfit, system-ui, -apple-system, \"Segoe UI\", sans-serif"
body = "\"DM Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Outfit"
style = "normal"
weight = "700 800"
path = "outfit-latin-700-800.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "110.46%"
descent = "122.69%"
line_gap = "0.00%"
size_adjust = "59.41%"

[[fonts.files]]
family = "DM Sans"
style = "normal"
weight = "400 700"
path = "dm-sans-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "109.58%"
descent = "146.29%"
line_gap = "0.00%"
size_adjust = "57.18%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
