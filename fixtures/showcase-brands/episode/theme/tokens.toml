# The sample brand for the Episode demo: a weekly podcast from the
# showcase's studio. A cool grey ground, near-black ink and one bright
# violet for the play marks and buttons, Libre Franklin in a heavy weight
# for headings and Public Sans for text. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#e9e8ee"
surface = "#f5f4f8"
text = "#16131f"
muted = "#4f4b5c"
link = "#4c1fb0"
accent = "#5a27d0"
border = "#cfcbd9"

[fonts]
heading = "\"Libre Franklin\", \"Franklin Gothic Medium\", system-ui, sans-serif"
body = "\"Public Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Libre Franklin"
style = "normal"
weight = "600 800"
path = "libre-franklin-latin-600-800.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "106.71%"
descent = "116.08%"
line_gap = "0.00%"
size_adjust = "62.37%"

[[fonts.files]]
family = "Public Sans"
style = "normal"
weight = "400 700"
path = "public-sans-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "104.94%"
descent = "106.18%"
line_gap = "0.00%"
size_adjust = "57.66%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
