# The sample brand for the Compass demo: a school that teaches online.
# Sky blue with pale blue panels, a rounded heavy sans for headings and a
# sans drawn for easy reading. Only the brand lives here: the template
# keeps its own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#eef7fc"
text = "#0f2433"
muted = "#4a5f6e"
link = "#03679d"
accent = "#0277b6"
border = "#cfe3ef"

[fonts]
heading = "Nunito, ui-rounded, \"SF Pro Rounded\", system-ui, sans-serif"
body = "\"Atkinson Hyperlegible\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Nunito"
style = "normal"
weight = "800"
path = "nunito-latin-800.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E1, U+00E4, U+00F3, U+00FC, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "111.68%"
descent = "166.58%"
line_gap = "0.00%"
size_adjust = "57.92%"

[[fonts.files]]
family = "Atkinson Hyperlegible"
style = "normal"
weight = "400"
path = "atkinson-hyperlegible-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E1, U+00E4, U+00F3, U+00FC, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "104.94%"
descent = "136.85%"
line_gap = "0.00%"
size_adjust = "56.55%"

[[fonts.files]]
family = "Atkinson Hyperlegible"
style = "normal"
weight = "700"
path = "atkinson-hyperlegible-latin-700.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E1, U+00E4, U+00F3, U+00FC, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "104.94%"
descent = "136.85%"
line_gap = "0.00%"
