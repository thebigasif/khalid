# The sample brand for the Atlas demo: a busy publication with many
# topics. A loud magenta on white, a heavy grotesque for headlines and a
# plain, sturdy sans for text. Only the brand lives here: the template
# keeps its own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#fbf1f5"
text = "#1a1120"
muted = "#5f5566"
link = "#b0124f"
accent = "#c8155c"
border = "#ead7e0"

[fonts]
heading = "\"Bricolage Grotesque\", \"Arial Black\", system-ui, sans-serif"
body = "\"Public Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Bricolage Grotesque"
style = "normal"
weight = "700 800"
path = "bricolage-grotesque-latin-700-800.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "102.73%"
descent = "127.41%"
line_gap = "0.00%"
size_adjust = "58.03%"

[[fonts.files]]
family = "Public Sans"
style = "normal"
weight = "400 700"
path = "public-sans-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "104.94%"
descent = "106.18%"
line_gap = "0.00%"
size_adjust = "57.66%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
