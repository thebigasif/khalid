# The sample brand for the Plinth demo: an architecture and interiors
# practice by a harbour. Deep green and ink on a pale stone, Jost for
# titles like the lettering on a drawing, Hanken Grotesk for the text.
# Only the brand lives here: the template keeps its own shape, type sizes
# and spacing.
[colors]
background = "#f4f3ee"
surface = "#e8e7df"
text = "#20241f"
muted = "#545b55"
link = "#2f5a46"
accent = "#2f5a46"
border = "#d3d4ca"

[fonts]
heading = "Jost, Futura, \"Century Gothic\", system-ui, sans-serif"
body = "\"Hanken Grotesk\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Jost"
style = "normal"
weight = "500"
path = "jost-latin-500.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B2, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "118.20%"
descent = "176.96%"
line_gap = "0.00%"
size_adjust = "60.25%"

[[fonts.files]]
family = "Hanken Grotesk"
style = "normal"
weight = "400"
path = "hanken-grotesk-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B2, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "110.46%"
descent = "142.98%"
line_gap = "0.00%"
size_adjust = "57.71%"

[[fonts.files]]
family = "Hanken Grotesk"
style = "normal"
weight = "600"
path = "hanken-grotesk-latin-600.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B2, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "110.46%"
descent = "142.98%"
line_gap = "0.00%"
size_adjust = "58.45%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
