# The sample brand for the Encore demo: Northlight Parade, a made-up band
# from Glasgow. Deep violet on warm white with a pale lilac surface, Anton
# for the poster headings and Archivo for the text. Only the brand lives
# here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#fbfaf7"
surface = "#eeecf6"
text = "#17152b"
muted = "#4c4963"
link = "#4a2bb0"
accent = "#5532d0"
border = "#d6d3e4"

[fonts]
heading = "Anton, Impact, \"Arial Narrow Bold\", sans-serif"
body = "Archivo, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"

[[fonts.files]]
family = "Anton"
style = "normal"
weight = "400"
path = "anton-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "129.94%"
descent = "155.30%"
line_gap = "0.00%"
size_adjust = "48.50%"

[[fonts.files]]
family = "Archivo"
style = "normal"
weight = "400 700"
path = "archivo-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "96.99%"
descent = "99.10%"
line_gap = "0.00%"
size_adjust = "60.89%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
