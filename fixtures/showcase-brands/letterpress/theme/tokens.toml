# The sample brand for the Letterpress demo: The Proof Sheet, a weekly
# letter about things made by hand. A letterpress red on a cream paper,
# Old Standard TT for the nameplate, titles and issue numbers, and Libre
# Caslon Text for the text. Only the brand lives here: the template keeps
# its own shape, type sizes and spacing.
[colors]
background = "#f7f3ea"
surface = "#eee6d6"
text = "#1c1b19"
muted = "#57514a"
link = "#a2301c"
accent = "#a2301c"
border = "#dacfbc"

[fonts]
heading = "\"Old Standard TT\", Didot, \"Times New Roman\", serif"
body = "\"Libre Caslon Text\", Baskerville, Georgia, serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Old Standard TT"
style = "normal"
weight = "700"
path = "old-standard-latin-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "84.17%"
descent = "112.31%"
line_gap = "721.39%"
size_adjust = "65.34%"

[[fonts.files]]
family = "Libre Caslon Text"
style = "normal"
weight = "400"
path = "libre-caslon-text-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "107.15%"
descent = "122.69%"
line_gap = "0.00%"
size_adjust = "62.48%"

[[fonts.files]]
family = "Libre Caslon Text"
