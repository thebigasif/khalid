# The sample brand for the Dispatch demo: The Saturday Gardener, a weekly
# letter about growing food and flowers in small spaces. Leaf green and
# ink on oatmeal, Gloock for titles like a printed masthead, Schibsted
# Grotesk for the text and the form. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#f6f4ec"
surface = "#e9e5d6"
text = "#1f2a1f"
muted = "#4f5a4c"
link = "#35612a"
accent = "#3d6b2f"
border = "#d4d0c0"

[fonts]
heading = "Gloock, \"Iowan Old Style\", Georgia, serif"
body = "\"Schibsted Grotesk\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Gloock"
style = "normal"
weight = "400"
path = "gloock-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A3, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "107.70%"
descent = "106.18%"
line_gap = "0.00%"
size_adjust = "59.62%"

[[fonts.files]]
family = "Schibsted Grotesk"
style = "normal"
weight = "400"
path = "schibsted-grotesk-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A3, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "107.87%"
descent = "121.66%"
line_gap = "0.00%"
size_adjust = "61.63%"

[[fonts.files]]
family = "Schibsted Grotesk"
style = "normal"
weight = "700"
path = "schibsted-grotesk-latin-700.woff2"
range = "U+0020-007E, U+00A0, U+00A3, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
