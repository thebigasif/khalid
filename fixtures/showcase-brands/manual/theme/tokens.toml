# The sample brand for the Manual demo: Brindle, a made-up maker of
# electric bikes, and its help centre. A deep teal for links on a warm
# white with a pale stone surface, a burnt orange accent for the section
# numbers, Schibsted Grotesk for titles, Albert Sans for the text and
# Spline Sans Mono for the numbers. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#fdfcf9"
surface = "#f0f0e8"
text = "#1b1f1c"
muted = "#525a54"
link = "#0e6458"
accent = "#c4501a"
border = "#dcdcd0"

[fonts]
heading = "\"Schibsted Grotesk\", \"Helvetica Neue\", Arial, sans-serif"
body = "\"Albert Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "\"Spline Sans Mono\", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Schibsted Grotesk"
style = "normal"
weight = "700"
path = "schibsted-grotesk-latin-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "107.87%"
descent = "121.66%"
line_gap = "0.00%"
size_adjust = "64.94%"

[[fonts.files]]
family = "Albert Sans"
style = "normal"
weight = "400"
path = "albert-sans-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
