# The sample brand for the Taste demo: a home baking blog. Flour-cream
# paper, cocoa ink, warm hairlines and a cinnamon accent for the topic
# names and buttons. Taste's two fonts, served from the blog itself: Poppins
# for headings, as Taste's "Playful" style sets them, and EB Garamond for
# the text, as its "Elegant" style does. Both come from their projects'
# own repositories with their OFL licences beside them. Only the brand
# lives here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#fdf8f1"
surface = "#f5ebdd"
text = "#2a1d16"
muted = "#6b5a4c"
link = "#8f3b17"
accent = "#a8461a"
border = "#ead9c5"

[fonts]
heading = "Poppins, system-ui, -apple-system, \"Segoe UI\", sans-serif"
body = "\"EB Garamond\", Garamond, \"Iowan Old Style\", Georgia, serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Poppins"
style = "normal"
weight = "600"
path = "poppins-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "115.99%"
descent = "165.16%"
line_gap = "305.67%"
size_adjust = "91.70%"

[[fonts.files]]
family = "Poppins"
style = "normal"
weight = "700"
path = "poppins-latin-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
