# The sample brand for the Channel demo: a pottery channel run by two
# potters. Fired clay on a cream page with a warm surface behind each
# video, Sora for titles and Onest for the text. Only the brand lives
# here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#fbf8f3"
surface = "#f1e9dd"
text = "#2a211c"
muted = "#65564b"
link = "#9a3f1f"
accent = "#9a3f1f"
border = "#e3d9cb"

[fonts]
heading = "Sora, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
body = "Onest, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Sora"
style = "normal"
weight = "600"
path = "sora-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "107.15%"
descent = "136.85%"
line_gap = "0.00%"
size_adjust = "63.54%"

[[fonts.files]]
family = "Onest"
style = "normal"
weight = "400"
path = "onest-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "107.15%"
descent = "143.93%"
line_gap = "0.00%"
size_adjust = "62.69%"

[[fonts.files]]
family = "Onest"
style = "normal"
weight = "600"
path = "onest-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "107.15%"
descent = "143.93%"
line_gap = "0.00%"
size_adjust = "64.38%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
