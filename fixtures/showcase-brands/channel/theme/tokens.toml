# The sample brand for the Channel demo: a pottery channel run by two
# potters. Fired clay on a cream page with a warm surface behind each
# video, Sora for titles and Onest for the text. Only the brand lives
# here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#fbf8f3"
surface = "#f1e9dd"
text = "#2a211c"
muted = "#65564b"
link = "#9a3f1f"
accent = "#9a3f1f"
border = "#e3d9cb"

[fonts]
heading = "Sora, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
body = "Onest, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Sora"
style = "normal"
weight = "600"
path = "sora-latin-600.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "107.15%"
descent = "136.85%"
line_gap = "0.00%"
size_adjust = "63.54%"

[[fonts.files]]
family = "Onest"
style = "normal"
weight = "400"
path = "onest-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "107.15%"
descent = "143.93%"
line_gap = "0.00%"
size_adjust = "62.69%"

[[fonts.files]]
family = "Onest"
style = "normal"
weight = "600"
path = "onest-latin-600.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
