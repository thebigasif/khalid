# The sample brand for the Atelier demo: Studio Ilvane, a small made-up
# fashion label. Ecru paper, near-black ink and a terracotta accent,
# Bodoni Moda for the label's name and the titles like a fashion
# magazine, and Jost for the text. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#f7f4ee"
surface = "#ebe5da"
text = "#1e1c1a"
muted = "#5a544c"
link = "#8c3a22"
accent = "#8c3a22"
border = "#d6cdbf"

[fonts]
heading = "\"Bodoni Moda\", Didot, \"Bodoni 72\", Georgia, serif"
body = "Jost, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"

[[fonts.files]]
family = "Bodoni Moda"
style = "normal"
weight = "500"
path = "bodoni-moda-latin-500.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "124.27%"
descent = "188.76%"
line_gap = "0.00%"
size_adjust = "61.47%"

[[fonts.files]]
family = "Jost"
style = "normal"
weight = "400"
path = "jost-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "118.20%"
descent = "176.96%"
line_gap = "0.00%"
size_adjust = "57.82%"

[[fonts.files]]
family = "Jost"
style = "normal"
weight = "500"
path = "jost-latin-500.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "118.20%"
descent = "176.96%"
line_gap = "0.00%"
size_adjust = "60.25%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
