# The sample brand for the Ease demo: the showcase studio's help centre.
# A white page, a deep slate for text and one sea green for the cover
# band, the search button and the "View all" links. Georgia for headings,
# as Ease's "Elegant serif" title setting does, and the system sans for
# text, so the brand needs no font files. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#f3f6f6"
text = "#1f2a2e"
muted = "#56636a"
link = "#0b6b63"
accent = "#0f7a70"
border = "#dde4e4"

[fonts]
heading = "Georgia, \"Times New Roman\", serif"
body = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
