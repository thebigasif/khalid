# The sample brand for the Locale demo: The Varrow List, a made-up guide
# to a made-up harbour city. Brick red on white with a warm stone surface,
# Young Serif for headings and Karla for the text and the listing rows.
# Only the brand lives here: the template keeps its own shape, type sizes
# and spacing.
[colors]
background = "#ffffff"
surface = "#f4efe6"
text = "#1c1e24"
muted = "#545866"
link = "#a8361b"
accent = "#a8361b"
border = "#e3dccf"

[fonts]
heading = "\"Young Serif\", Georgia, \"Times New Roman\", serif"
body = "Karla, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Young Serif"
style = "normal"
weight = "400"
path = "young-serif-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "115.55%"
descent = "172.71%"
line_gap = "0.00%"
size_adjust = "66.50%"

[[fonts.files]]
family = "Karla"
style = "normal"
weight = "400"
path = "karla-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "101.30%"
descent = "118.92%"
line_gap = "0.00%"
size_adjust = "55.86%"

[[fonts.files]]
family = "Karla"
style = "normal"
weight = "700"
path = "karla-latin-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "101.30%"
descent = "118.92%"
line_gap = "0.00%"
size_adjust = "58.51%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
