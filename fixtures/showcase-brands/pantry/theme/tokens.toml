# The sample brand for the Pantry demo: Oven Spring, a home baking blog.
# Cherry on a warm flour-white page with a butter surface, Alegreya for
# titles and Alegreya Sans for the text. Only the brand lives here: the
# template keeps its own shape, type sizes and spacing.
[colors]
background = "#fffaf2"
surface = "#f5ead7"
text = "#2b1f17"
muted = "#5e4b3c"
link = "#9a2a2e"
accent = "#9a2a2e"
border = "#e8dac2"

[fonts]
heading = "Alegreya, Georgia, serif"
body = "\"Alegreya Sans\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"

[[fonts.files]]
family = "Alegreya"
style = "normal"
weight = "500 800"
path = "alegreya-latin-500-800.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "112.23%"
descent = "162.80%"
line_gap = "0.00%"
size_adjust = "58.77%"

[[fonts.files]]
family = "Alegreya Sans"
style = "normal"
weight = "400"
path = "alegreya-sans-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "99.42%"
descent = "141.57%"
line_gap = "0.00%"
size_adjust = "54.75%"

[[fonts.files]]
family = "Alegreya Sans"
style = "normal"
weight = "700"
path = "alegreya-sans-latin-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "99.42%"
descent = "141.57%"
line_gap = "0.00%"
size_adjust = "56.76%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
