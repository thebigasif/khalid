# The sample brand for the Respawn demo: Lowpoly Post, a made-up games
# site. Deep magenta on white with a pale lilac surface, Chakra Petch for
# titles, scores and labels, and Barlow for the text. Only the brand lives
# here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#ffffff"
surface = "#f4eff6"
text = "#1a1220"
muted = "#594e60"
link = "#a3124f"
accent = "#a3124f"
border = "#e2d8e6"

[fonts]
heading = "\"Chakra Petch\", Bahnschrift, \"Arial Narrow\", system-ui, sans-serif"
body = "Barlow, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[[fonts.files]]
family = "Chakra Petch"
style = "normal"
weight = "700"
path = "chakra-petch-latin-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "109.58%"
descent = "145.34%"
line_gap = "0.00%"
size_adjust = "60.57%"

[[fonts.files]]
family = "Barlow"
style = "normal"
weight = "400"
path = "barlow-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "110.46%"
descent = "94.38%"
line_gap = "0.00%"
size_adjust = "54.32%"

[[fonts.files]]
family = "Barlow"
style = "normal"
weight = "600"
path = "barlow-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "110.46%"
descent = "94.38%"
line_gap = "0.00%"
size_adjust = "55.28%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
