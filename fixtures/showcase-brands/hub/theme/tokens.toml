# The sample brand for the Hub demo: a potter's studio. Terracotta on a
# warm clay-white page with a sand surface, Sora for the name and the
# link tiles and Hanken Grotesk for the text. Only the brand lives here:
# the template keeps its own shape, type sizes and spacing.
[colors]
background = "#f8f3ec"
surface = "#efe4d4"
text = "#2b211c"
muted = "#5f5148"
link = "#9a3e1b"
accent = "#9a3e1b"
border = "#dccab4"

[fonts]
heading = "Sora, ui-rounded, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
body = "\"Hanken Grotesk\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"

[[fonts.files]]
family = "Sora"
style = "normal"
weight = "700"
path = "sora-latin-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "107.15%"
descent = "136.85%"
line_gap = "0.00%"
size_adjust = "64.07%"

[[fonts.files]]
family = "Hanken Grotesk"
style = "normal"
weight = "400"
path = "hanken-grotesk-latin-400.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "110.46%"
descent = "142.98%"
line_gap = "0.00%"
size_adjust = "57.71%"

[[fonts.files]]
family = "Hanken Grotesk"
style = "normal"
weight = "600"
path = "hanken-grotesk-latin-600.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
