# The sample brand for the Hub demo: a potter's studio. Terracotta on a
# warm clay-white page with a sand surface, Sora for the name and the
# link tiles and Hanken Grotesk for the text. Only the brand lives here:
# the template keeps its own shape, type sizes and spacing.
[colors]
background = "#f8f3ec"
surface = "#efe4d4"
text = "#2b211c"
muted = "#5f5148"
link = "#9a3e1b"
accent = "#9a3e1b"
border = "#dccab4"

[fonts]
heading = "Sora, ui-rounded, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"
body = "\"Hanken Grotesk\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif"

[[fonts.files]]
family = "Sora"
style = "normal"
weight = "700"
path = "sora-latin-700.woff2"
range = "U+0020-007E, U+00A0, U+00A3, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "107.15%"
descent = "136.85%"
line_gap = "0.00%"
size_adjust = "64.07%"

[[fonts.files]]
family = "Hanken Grotesk"
style = "normal"
weight = "400"
path = "hanken-grotesk-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A3, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "110.46%"
descent = "142.98%"
