size_adjust = "57.71%"

[[fonts.files]]
family = "Hanken Grotesk"
style = "normal"
weight = "600"
path = "hanken-grotesk-latin-600.woff2"
range = "U+0020-007E, U+00A0, U+00A3, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
