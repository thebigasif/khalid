# The sample brand for the Masthead demo: The Common Room, a monthly
# magazine. Deep blue on a cream page with a light sand surface, Playfair
# Display for the nameplate and titles and Lora for the text. Only the
# brand lives here: the template keeps its own shape, type sizes and
# spacing.
[colors]
background = "#fbf8f2"
surface = "#efe8da"
text = "#1d1b18"
muted = "#5a5247"
link = "#1e4d6b"
accent = "#1e4d6b"
border = "#e0d7c6"

[fonts]
heading = "\"Playfair Display\", Didot, \"Bodoni 72\", Georgia, serif"
body = "Lora, Charter, Georgia, serif"

[[fonts.files]]
family = "Playfair Display"
style = "normal"
weight = "700"
path = "playfair-display-latin-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "119.52%"
descent = "118.44%"
line_gap = "0.00%"
size_adjust = "64.28%"

[[fonts.files]]
family = "Lora"
style = "normal"
weight = "400 700"
path = "lora-latin-400-700.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "63.43%"

[[fonts.files]]
family = "Lora"
style = "italic"
weight = "400"
path = "lora-latin-400-italic.woff2"
range = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
[fonts.files.metrics]
ascent = "111.13%"
descent = "129.30%"
line_gap = "0.00%"
size_adjust = "62.37%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
