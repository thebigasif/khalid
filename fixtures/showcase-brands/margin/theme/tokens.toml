# The sample brand for the Margin demo: an essayist on the coast. Ink
# blue on warm paper with a sand surface, and Crimson Pro, a book serif,
# for every word, with its italic for the margin notes. Only the brand
# lives here: the template keeps its own shape, type sizes and spacing.
[colors]
background = "#f8f6f0"
surface = "#eeeae0"
text = "#1a1d24"
muted = "#565b66"
link = "#234a7a"
accent = "#2d5a8c"
border = "#dcd6c9"

[fonts]
heading = "\"Crimson Pro\", \"Iowan Old Style\", Palatino, Georgia, serif"
body = "\"Crimson Pro\", \"Iowan Old Style\", Palatino, Georgia, serif"

[[fonts.files]]
family = "Crimson Pro"
style = "normal"
weight = "400"
path = "crimson-pro-latin-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "99.03%"
descent = "101.38%"
line_gap = "0.00%"
size_adjust = "51.50%"

[[fonts.files]]
family = "Crimson Pro"
style = "normal"
weight = "600"
path = "crimson-pro-latin-600.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "99.03%"
descent = "101.38%"
line_gap = "0.00%"
size_adjust = "53.05%"

[[fonts.files]]
family = "Crimson Pro"
style = "italic"
weight = "400"
path = "crimson-pro-latin-italic-400.woff2"
range = "U+0020-007E, U+00A0, U+00A9, U+00AB, U+00B0, U+00B7, U+00BB, U+00D7, U+00E9, U+2013-2014, U+2018-201A, U+201C-201E, U+2022, U+2026, U+2039-203A, U+20AC, U+2122, U+2212"
[fonts.files.metrics]
ascent = "99.03%"
descent = "101.38%"
line_gap = "0.00%"
size_adjust = "50.57%"

# The brand's logo, served from the showcase's about page. The shared
# sample-brand step copies logo.svg from this folder to that address.
[brand]
logo = "https://www.example.com/blog/about/logo.svg"
