# Keystone Studio, the made-up company blog of a small design studio,
# written for the Keystone template's demo. Each key and table here
# replaces the showcase's own when scripts/demo-publication.sh applies it.

name = "Keystone Studio"
languages = ["en"]

[template.cta]
label = "Start a project"
href = "/blog/about/"
note = "We take on six projects at a time, for local clients, and answer every enquiry within two working days."

[announcement]
text = "New: what we hand over at the end of a brand project, and why it fits in one folder."
href = "/blog/brand-guidelines-handover/"
language = "en"

[seo.titles]
separator = "·"
tagline = "Project notes and process from a small design studio"

[seo.ai_page]
covers = "Keystone Studio writes about its own projects in brand identity, signage, wayfinding, packaging and small websites, about how a design project runs, and about the craft of print, type and colour."
cite = "Name Keystone Studio and the author, and link the post you quote."
contact = "hello@example.com"

[seo.publisher]
type = "organization"
name = "Keystone Studio"
email = "hello@example.com"
founded = "2014-03-01"

[seo.publisher.logo]
url = "https://www.example.com/blog/about/logo.svg"
alt = "The Keystone Studio logo"
width = 320
height = 80

# Sign-ups for the studio's newsletter, under the publication's own name.
# The mail server is a reserved example name, so nothing is ever sent.
[mail]
from = "studio@example.com"
name = "Keystone Studio"
postal_address = "Keystone Studio, 2 Ropewalk Yard, Eastbridge EB4 1KS"

[mail.smtp]
host = "smtp.example.com"

