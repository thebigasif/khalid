# Tessel Rowe Architects' types of work. The Plinth template lists each
# one that holds projects on the front page, and each category page shows
# its projects as numbered sheets, with its intro on top.

[[categories]]
slug = "houses"
en = "Houses"

[categories.seo.en]
description = "Houses by Tessel Rowe Architects: new houses on awkward plots and old houses repaired and extended."
intro = "New houses on narrow or sloping plots, and old houses repaired and opened up. Most of our houses are for families who want more light, not more rooms."

[[categories]]
slug = "interiors"
en = "Interiors"

[categories.seo.en]
description = "Interiors by Tessel Rowe Architects: flats, shops and cafes fitted into existing buildings."
intro = "Flats, shops and cafes fitted into rooms that were built for something else. We design the joinery, the lighting and the finishes as one piece."

[[categories]]
