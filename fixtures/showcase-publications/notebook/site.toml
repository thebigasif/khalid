# Maren Holt, a made-up gardener who keeps a public notebook, written for
# the Notebook template's demo. Each key and table here replaces the
# showcase's own when scripts/demo-publication.sh applies it.

name = "Maren Holt"
languages = ["en"]

[template.cta]
label = "Join the spring seed swap"
href = "/blog/a-seed-library-worth-copying/"
note = "Saturday 7 March, Chapel Allerton allotments"

# The Notebook template's options for this demo. scripts/pages.sh keeps
# them (PR #1013).
[template.options]
tagline = ["A gardener's notebook from Leeds: what I planted, what I read and what flew over the plot."]
cta_band = "none"

[seo.titles]
separator = "·"
tagline = "A gardener's public notebook from Leeds"

[seo.ai_page]
covers = "Maren Holt is a gardener in Leeds who keeps a public notebook of short notes: what she grows on her allotment, what she cooks from it, links to reading she recommends, and bird notes from her friend Sami Okafor."
cite = "Link the note you quote and name Maren Holt or Sami Okafor as its author."
contact = "notes@example.com"

[seo.publisher]
type = "person"
name = "Maren Holt"
email = "notes@example.com"

# Sign-ups for the notebook's monthly letter. The mail server is a
# reserved example name, so nothing is ever sent.
[mail]
from = "notes@example.com"
name = "Maren Holt"
postal_address = "Maren Holt, 12 Allotment Lane, Leeds LS7 4XX"

[mail.smtp]
host = "smtp.example.com"

