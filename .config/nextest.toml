# The slowest tests start first. A few take 20 seconds to over two minutes,
# and they used to start minutes into a run, so the whole run waited on
# them at the end. Measured in CI run 41819362381 on 4 November 2026.
[[profile.default.overrides]]
filter = '''
    test(every_template_demo_shows_the_showcase_call_to_action)
    | test(/serves_the_openapi_document/)
    | binary(build_every_template)
    | binary(examples)
    | test(/avif/)
    | test(the_built_showcase_passes_the_audit_with_no_new_warning)
    | test(the_showcase_home_page_shows_covers_and_portraits_on_its_cards)
'''
priority = 100
