# The website wears Atlas, the portal template. theme/site.css adds the
# product site's own rules: the hero, the grids, the cards and the gallery.
[template]
name = "atlas"

[template.options]
share = "none"
cta_band = "post"
contents = "none"

[template.cta]
label = "Start a blog"
href = "/khalid/start/"
note = "Free and open source. Pick one of three ways to start."
