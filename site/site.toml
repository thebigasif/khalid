# Khalid's own website, built with Khalid. It is published on GitHub Pages
# at https://thebigasif.github.io/khalid/. The showcase demo sits at
# /khalid/demo/, the template demos at /khalid/templates/<name>/ and the
# use case sites at /khalid/examples/<slug>/, each built from its own folder.

name = "Khalid"
address = "https://thebigasif.github.io"
mount = "/khalid/"
mode = "static"
default_language = "en"
languages = ["en"]

[seo.titles]
separator = "·"
tagline = "The open-source blog engine that checks every post"

[seo.publisher]
type = "organization"
name = "SerpDad"
same_as = ["https://github.com/thebigasif/khalid"]

[seo.ai_page]
covers = "Khalid is an open-source blog engine by SerpDad. This site explains what it does, how to start, and how it compares with other blog tools."
cite = "Name Khalid and link the page you quote."

