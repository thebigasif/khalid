# The website's colours, fonts and shape, read by the templates and by
# theme/site.css as CSS variables. Paper and ink with an editor's orange
# pen: the accent marks what Khalid checks and the buttons that start it.

[colors]
background = "#ffffff"
surface = "#f7f5f0"
text = "#16181d"
muted = "#4f5563"
link = "#1f4fc7"
accent = "#c2410c"
border = "#e4dfd4"

[fonts]
body = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
heading = '"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, ui-serif, serif'
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[shape]
radius = "0.75rem"
measure = "68ch"

[type]
body = "1.0625rem 1.125rem"
h1 = "2.375rem 3.75rem"
h2 = "1.75rem 2.5rem"
h3 = "1.25rem 1.375rem"
small = "0.9375rem"
line_height = 1.65
heading_weight = 700

[space]
unit = "0.5rem"
section = "5rem"
