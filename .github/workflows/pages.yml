name: Pages

# Builds Khalid's demos with the binary from this commit and publishes them
# to the GitHub release named "demos", which the serpdad.com build reads.
#
# GitHub Pages, https://thebigasif.github.io/khalid/, only forwards to
# serpdad.com/khalid/, Khalid's one home (plan U16). The workflow still
# builds the old Pages copy, since its pages are the old addresses, and
# scripts/pages-forward.sh turns each into a small page that sends visitors
# and search engines to the new address. Pages publishes nothing else:
#
#   /khalid/                    the website's pages, to the landing page,
#                               the docs and the comparison
#   /khalid/demo/               the showcase site, to the same page
#   /khalid/examples/<slug>/    each example, to the same page
#   /khalid/templates/<name>/   each template's demo, to its template page
#                               and to the same page of its new demo
#
# The release named "demos" is a prerelease and never "latest", so
# /releases/latest, scripts/install.sh and `khalid update` still find the
# newest v release.
# Its files are replaced in place; the release is never deleted.
#
# A change to the sites publishes on its own. A change to the engine
# publishes at the next release, or by running this workflow by hand, so
# CI does not build a release binary for every pull request that lands.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "fixtures/showcase-site/**"
      - "fixtures/examples/**"
      - "fixtures/showcase-brands/**"
      - "fixtures/showcase-publications/**"
      - "scripts/pages.sh"
      - "scripts/demo-brand.sh"
      - "scripts/template-previews.sh"
      - "scripts/demos-bundle.sh"
      - "scripts/pages-forward.sh"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the website and demos
    # Only a v release builds; the demos release this workflow fills is not
    # a version of Khalid.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: pages
      - name: Binary from this commit
        run: |
          cargo build --release -p khalid
          ./target/release/khalid --version
      - name: Build the old Pages copy, whose pages are the old addresses
        run: bash scripts/pages.sh --canonical https://serpdad.com ./target/release/khalid "$RUNNER_TEMP/pages" https://thebigasif.github.io /khalid/
      - name: Template previews
        # cwebp keeps each full-size preview to a hundred or two kilobytes.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends webp
          bash scripts/template-previews.sh "$RUNNER_TEMP/pages" /khalid/
      - name: The demos for serpdad.com, with the same previews
        run: |
          bash scripts/demos-bundle.sh ./target/release/khalid "$RUNNER_TEMP/demos/khalid" "$RUNNER_TEMP/pages/templates"
      - name: A forwarder to serpdad.com for every old address
        run: |
          bash scripts/pages-forward.sh --selftest
          bash scripts/pages-forward.sh "$RUNNER_TEMP/pages" "$RUNNER_TEMP/demos/khalid" "$RUNNER_TEMP/forward"
      # The docs pack joins once scripts/docs-bundle.sh is on main. It builds
      # in the folder it is given and writes khalid-docs.tar.gz beside it. The demo photographs are not in git, so their
      # archive is uploaded from the build server by hand, never from here.
      - name: The bundles for the demos release
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP/demos/khalid-demos.tar.gz" "$RUNNER_TEMP/release/"
          if [ -f scripts/docs-bundle.sh ]; then
            bash scripts/docs-bundle.sh "$RUNNER_TEMP/release/docs"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: demos-release
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/forward
  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The bundles on the release named "demos". The first run creates it as a
  # prerelease that is never "latest"; every run after replaces its files in
  # place with --clobber. Files it does not upload, such as the demo
  # photographs, stay as they are.
  demos-release:
    name: Bundles on the demos release
    needs: build
    # A hand run from another branch publishes its Pages build as now, but
    # leaves the bundles serpdad.com reads alone.
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: demos-release
          path: release
      - name: Create the demos release once
        run: |
          if ! gh release view demos >/dev/null 2>&1; then
            gh release create demos --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Demos for serpdad.com" \
              --notes "The demo sites, template list and preview pictures serpdad.com/khalid/ is built from. This is not a version of Khalid: install Khalid from the newest v release."
          fi
      - name: Replace the bundles
        run: |
          for file in khalid-demos.tar.gz khalid-docs.tar.gz demo-photos.tar.gz; do
            if [ -f "release/$file" ]; then
              gh release upload demos "release/$file" --clobber
            fi
          done
      - name: The newest release is still a v release
        run: |
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          case "$latest" in
            v[0-9]*) echo "The newest release is still $latest." ;;
            *) echo "The newest release is now $latest, not a v release, so scripts/install.sh and khalid update would install the wrong thing. Mark $latest as not latest on GitHub."; exit 1 ;;
          esac
