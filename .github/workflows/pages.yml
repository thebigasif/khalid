name: Pages

# Publishes Khalid's website and its demos to GitHub Pages under
# https://thebigasif.github.io/khalid/, all built by the binary from this
# commit, so a template that lands shows at once:
#
#   /khalid/                    the website (site/)
#   /khalid/demo/               the showcase site (fixtures/showcase-site)
#   /khalid/examples/<slug>/    each example in fixtures/examples/
#   /khalid/templates/<name>/   the showcase in each template the binary has
#
# A change to the sites publishes on its own. A change to the engine
# publishes at the next release, or by running this workflow by hand, so
# CI does not build a release binary for every pull request that lands.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "fixtures/showcase-site/**"
      - "fixtures/examples/**"
      - "scripts/pages.sh"
      - "scripts/template-previews.sh"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the website and demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: pages
      - name: Binary from this commit
        run: |
          cargo build --release -p khalid
          ./target/release/khalid --version
      - name: Build every site for the Pages address
        run: bash scripts/pages.sh ./target/release/khalid "$RUNNER_TEMP/pages" https://thebigasif.github.io /khalid/
      - name: Template previews
        run: bash scripts/template-previews.sh "$RUNNER_TEMP/pages" /khalid/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages
  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
