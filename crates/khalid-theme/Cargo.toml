[package]
name = "khalid-theme"
version.workspace = true
description = "Theme sync and template packs: read a main site's colours, fonts and logo into theme tokens, fix contrast, and hold the built-in looks."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The throwaway trial pack, for this crate's tests and other crates' tests.
test-util = []

[dependencies]
khalid-core.workspace = true
khalid-outbound = { path = "../khalid-outbound", version = "1.0.1" }
scraper = "0.29"
serde.workspace = true
thiserror.workspace = true
toml = "1.1"
url = "2"
read-fonts = "0.41"

[dev-dependencies]
khalid-outbound = { path = "../khalid-outbound", version = "1.0.1", features = ["test-util"] }
khalid-theme = { path = ".", version = "1.0.1", features = ["test-util"] }
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
wiremock = "0.6"

[lints]
workspace = true
