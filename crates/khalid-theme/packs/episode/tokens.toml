# Based on Ghost's Episode theme, MIT licence, see LICENSE-ghost.txt.
# Episode's own look, for a blog that has not run theme sync: Episode's
# light grey ground, near-black ink for the bands and the boxed episodes,
# and one strong pink for the play marks and buttons. Square corners. The
# system sans for headings and text, in a heavy weight for headings. A
# value in the site's own theme/tokens.toml wins over each of these.
[colors]
background = "#ebebeb"
surface = "#f6f6f6"
text = "#15171a"
muted = "#4b4f56"
link = "#b3004f"
accent = "#d1005f"
border = "#c9c9c9"

[fonts]
heading = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"
body = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"

[shape]
radius = "0rem"
measure = "42rem"

[type]
body = "1.0625rem 1.1875rem"
h1 = "2.25rem 3.25rem"
h2 = "1.625rem 2.25rem"
h3 = "1.25rem 1.5rem"
h4 = "1.0625rem 1.125rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 800

[space]
unit = "0.5rem"
section = "4rem"
