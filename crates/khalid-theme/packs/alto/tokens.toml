# Based on Ghost's Alto theme, MIT licence, see LICENSE-ghost.txt.
# Alto's defaults: white paper, soft charcoal ink, light grey panels and
# lines, and a calm blue as the accent. Inter for every word, as Alto's
# "Modern sans-serif" title and body fonts. A site's own tokens replace
# any of them.
[colors]
background = "#ffffff"
surface = "#f1f1f1"
text = "#333333"
muted = "#6e6e6e"
link = "#1a6ca3"
accent = "#1f7ab8"
border = "#e3e3e3"

[fonts]
heading = "Inter, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
body = "Inter, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
mono = "Menlo, Consolas, Monaco, \"Liberation Mono\", \"Lucida Console\", monospace"

[shape]
radius = "0px"
measure = "38rem"

[type]
body = "1rem"
h1 = "2.25rem 3rem"
h2 = "1.5rem 1.875rem"
h3 = "1.25rem"
h4 = "1.0625rem"
small = "0.75rem"
line_height = 1.6
heading_weight = 800

[space]
unit = "0.5rem"
section = "4rem"
