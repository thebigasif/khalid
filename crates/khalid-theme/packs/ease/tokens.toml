# Based on Ghost's Ease theme, MIT licence, see LICENSE-ghost.txt.
# Ease's own look, for a blog that has not run theme sync: a white page,
# dark grey text, light grey hairlines and one violet for the cover band,
# the search button and the "View all" links. The grey for quiet text is
# darker than Ease's, so it reads at WCAG AA. The system sans for headings
# and text, as Ease sets them. Small rounded corners. A value in the
# site's own theme/tokens.toml wins over each of these.
[colors]
background = "#ffffff"
surface = "#f7f7f7"
text = "#333333"
muted = "#666666"
link = "#5a4ad1"
accent = "#6c5ce7"
border = "#e6e6e6"

[fonts]
heading = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
body = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"

[shape]
radius = "0.3125rem"
measure = "38rem"

[type]
body = "1rem 1.0625rem"
h1 = "2rem 2.375rem"
h2 = "1.375rem 1.625rem"
h3 = "1.1875rem 1.375rem"
h4 = "1.0625rem 1.125rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 700

[space]
unit = "0.5rem"
section = "4.5rem"
