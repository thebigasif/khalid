# Based on Ghost's Dope theme, MIT licence, see LICENSE-ghost.txt.
# Dope's own look, for a blog that has not run theme sync: a white page,
# near-black ink, a light grey placeholder behind every picture and a soft
# periwinkle accent on the topic pills and "read more" links. Headings set
# heavy (800) and tight; text in the reader's own sans. A value in the
# site's own theme/tokens.toml wins.
[colors]
background = "#ffffff"
surface = "#f1f1f1"
text = "#1a1a1a"
muted = "#6b6b6b"
link = "#5c5785"
accent = "#7f7aa3"
border = "#d9d9d9"

[fonts]
heading = "Raleway, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
body = "Raleway, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"

[type]
body = "1.125rem 1.1875rem"
h1 = "2.25rem 3.5rem"
h2 = "1.75rem 2rem"
h3 = "1.375rem 1.5rem"
h4 = "1.1875rem 1.25rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 800

[space]
unit = "0.5rem"
section = "5.5rem"

[shape]
radius = "0rem"
measure = "38rem"
