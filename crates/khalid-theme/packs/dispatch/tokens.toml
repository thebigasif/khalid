# Dispatch: a newsletter whose site wins sign-ups. Warm letter paper,
# near-black ink, one postal red for the stamps, the buttons and the
# links, and a deeper paper surface for the reply slip. A book serif for
# titles and the system sans for the text and the form.
[colors]
background = "#fbf8f2"
surface = "#f1eadc"
text = "#1e1b17"
muted = "#5d564b"
link = "#a3261c"
accent = "#b02a1f"
border = "#ddd4c4"

[fonts]
heading = "\"Iowan Old Style\", \"Palatino Linotype\", Palatino, \"Book Antiqua\", Georgia, serif"
body = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[shape]
radius = "0.25rem"
measure = "36rem"

[type]
body = "1.125rem 1.1875rem"
h1 = "2.25rem 3.25rem"
h2 = "1.5rem 1.875rem"
h3 = "1.25rem 1.375rem"
h4 = "1.0625rem 1.125rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 400

[space]
unit = "0.5rem"
section = "4rem"
