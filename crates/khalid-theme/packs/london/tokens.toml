# Based on Ghost's London theme, MIT licence, see LICENSE-ghost.txt.
# London's own look, for a blog that has not run theme sync: white paper,
# near-black ink, light grey lines and one deep blue for links, so the
# pictures carry the colour. Everything in one sans, set heavy for titles,
# as London's Mulish. A value in the site's own theme/tokens.toml wins.
[colors]
background = "#ffffff"
surface = "#f4f4f4"
text = "#131313"
muted = "#5f5f5f"
link = "#1f6fae"
accent = "#1f6fae"
border = "#dddddd"

[fonts]
heading = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
body = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
mono = "Menlo, Courier, monospace"

[type]
body = "1.125rem 1.1875rem"
h1 = "2.25rem 3.75rem"
h2 = "1.625rem 2rem"
h3 = "1.375rem 1.5rem"
h4 = "1.1875rem 1.25rem"
small = "0.875rem"
line_height = 1.7
heading_weight = 800

[space]
unit = "0.5rem"
section = "4rem"

[shape]
radius = "0px"
measure = "40rem"
