# Based on Ghost's Edition theme, MIT licence, see LICENSE-ghost.txt.
# Edition's own look, for a blog that has not run theme sync: a white
# page, near-black ink, light grey hairlines and one warm orange for the
# buttons and the date blocks. Small rounded corners. The system sans for
# headings and text, in a heavy weight for headings. A value in the
# site's own theme/tokens.toml wins over each of these.
[colors]
background = "#ffffff"
surface = "#f6f6f6"
text = "#1a1a1a"
muted = "#666666"
link = "#b8350f"
accent = "#cf3f14"
border = "#e6e6e6"

[fonts]
heading = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"
body = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"

[shape]
radius = "0.375rem"
measure = "45rem"

[type]
body = "1rem 1.0625rem"
h1 = "2.125rem 2.5rem"
h2 = "1.5rem 1.875rem"
h3 = "1.125rem 1.25rem"
h4 = "1rem 1.0625rem"
small = "0.8125rem"
line_height = 1.6
heading_weight = 800

[space]
unit = "0.5rem"
section = "4.5rem"
