# Based on Ghost's Journal theme, MIT licence, see LICENSE-ghost.txt.
# Journal's own look, for a blog that has not run theme sync: a white
# page, near-black ink, light grey hairlines and one cobalt accent that
# fills the sign-up band. Titles, labels and posts all in the system's
# sans, as Ghost's default; a serif heading font from theme sync turns the
# titles literary. A value in the site's own theme/tokens.toml wins.
[colors]
background = "#ffffff"
surface = "#f4f5f6"
text = "#15171a"
muted = "#5c6066"
link = "#2442b5"
accent = "#2c50d3"
border = "#e3e5e8"

[fonts]
heading = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
body = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"

[type]
body = "1.0625rem 1.1875rem"
h1 = "2.625rem 4.625rem"
h2 = "1.75rem 2.125rem"
h3 = "1.375rem 1.5rem"
h4 = "1.125rem 1.25rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 600

[space]
unit = "0.5rem"
section = "5rem"

[shape]
radius = "0.375rem"
measure = "38rem"
