# Encore: a band's site like a gig poster on a record shelf. Poster paper,
# black ink and one vermilion accent for the record labels, the ticket
# links and the buttons. A tall condensed face for headings, set in
# capitals, and a sturdy sans for the text. Square corners.
[colors]
background = "#f4f1ea"
surface = "#e8e2d4"
text = "#151413"
muted = "#524d45"
link = "#a8261a"
accent = "#c42e1c"
border = "#cdc5b4"

[fonts]
heading = "Impact, \"Haettenschweiler\", \"Arial Narrow Bold\", \"Franklin Gothic Bold\", system-ui, sans-serif"
body = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"

[shape]
radius = "0rem"
measure = "40rem"

[type]
body = "1.125rem 1.1875rem"
h1 = "2.5rem 4rem"
h2 = "1.75rem 2.25rem"
h3 = "1.25rem 1.5rem"
h4 = "1.0625rem 1.125rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 400

[space]
unit = "0.5rem"
section = "4.5rem"
