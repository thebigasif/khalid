# Notebook: one person's public notebook. A cream page like notebook
# paper, brown-black ink and a red margin rule like an exercise book. A
# calligraphic book serif for the words and a typewriter face for the
# dates in the margin.
[colors]
background = "#fbf8f1"
surface = "#f3eee2"
text = "#24211c"
muted = "#5e584d"
link = "#9e2f1d"
accent = "#9e2f1d"
border = "#e2dac8"

[fonts]
heading = "Palatino, \"Palatino Linotype\", \"Book Antiqua\", \"URW Palladio L\", Georgia, serif"
body = "Palatino, \"Palatino Linotype\", \"Book Antiqua\", \"URW Palladio L\", Georgia, serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[shape]
radius = "2px"
measure = "32rem"

[type]
body = "1.125rem 1.1875rem"
h1 = "1.875rem 2.625rem"
h2 = "1.375rem 1.625rem"
h3 = "1.1875rem 1.375rem"
h4 = "1.0625rem 1.125rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 700

[space]
unit = "0.5rem"
section = "4rem"
