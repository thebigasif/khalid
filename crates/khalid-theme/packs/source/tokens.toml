# Based on Ghost's Source theme, MIT licence, see LICENSE-ghost.txt.
# Source's defaults: white paper, near-black ink, grey hairlines and one
# ink accent for buttons, with Inter for every heading and all text where
# the reader has it, and the system's sans where not. A site's own tokens
# replace any of them.
[colors]
background = "#ffffff"
surface = "#f2f2f2"
text = "#15171a"
muted = "#5f6166"
link = "#15171a"
accent = "#15171a"
border = "#e6e6e6"

[fonts]
heading = "Inter, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", sans-serif"
body = "Inter, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", sans-serif"
mono = "\"JetBrains Mono\", Menlo, Consolas, Monaco, \"Liberation Mono\", monospace"

[shape]
radius = "0px"
measure = "45rem"

[type]
body = "1rem"
h1 = "2.125rem 2.875rem"
h2 = "1.5rem 1.75rem"
h3 = "1.25rem 1.375rem"
h4 = "1.0625rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 700

[space]
unit = "0.5rem"
section = "4rem"
