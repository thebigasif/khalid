# Based on Ghost's Digest theme, MIT licence, see LICENSE-ghost.txt.
# Digest's own look, for a blog that has not run theme sync: a white
# page, near-black ink, a pale grey for the post band and the soft
# panels, and one cobalt accent for labels, rules and the subscribe
# button. Headings, labels and posts all in the system's sans, headings
# set heavy, as Ghost's Digest sets everything in one sans. A value in
# the site's own theme/tokens.toml wins.
[colors]
background = "#ffffff"
surface = "#f4f4f5"
text = "#15171a"
muted = "#5f646b"
link = "#2a46b8"
accent = "#3352d6"
border = "#e3e4e6"

[fonts]
heading = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
body = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"

[type]
body = "1.125rem 1.1875rem"
h1 = "2.25rem 3rem"
h2 = "1.625rem 2rem"
h3 = "1.375rem 1.5rem"
h4 = "1.1875rem 1.25rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 800

[space]
unit = "0.5rem"
section = "4rem"

[shape]
radius = "0.5rem"
measure = "45rem"
