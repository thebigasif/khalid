# Frequency: a podcast's site. Warm paper, ink for the On air console and
# the episode plate, and one signal orange for the running-time dial,
# links and buttons. A lively grotesque for titles, a calm sans for the
# show notes, and mono figures for numbers and running times.
[colors]
background = "#fbfaf7"
surface = "#f1eee6"
text = "#17161c"
muted = "#56535e"
link = "#b23a0e"
accent = "#b23a0e"
border = "#e2ddd2"

[fonts]
heading = "\"Avenir Next\", Avenir, \"Helvetica Neue\", Arial, sans-serif"
body = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[shape]
radius = "0.375rem"
measure = "40rem"

[type]
body = "1.0625rem 1.125rem"
h1 = "2.125rem 3.25rem"
h2 = "1.5rem 2rem"
h3 = "1.1875rem 1.375rem"
h4 = "1.0625rem 1.125rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 700

[space]
unit = "0.5rem"
section = "4.5rem"
