# Respawn: a games site. Cool white paper, near-black ink for the score
# tiles and rules, one electric violet accent for the health bar, links
# and buttons. A squared sans for titles, scores and labels, a plain sans
# for the text, which is large for long reviews.
[colors]
background = "#f8f8fb"
surface = "#eceaf4"
text = "#16141f"
muted = "#524f63"
link = "#5a22d4"
accent = "#5a22d4"
border = "#d6d3e2"

[fonts]
heading = "Bahnschrift, \"DIN Alternate\", \"Franklin Gothic Medium\", \"Arial Narrow\", system-ui, sans-serif"
body = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"

[shape]
radius = "0px"
measure = "38rem"

[type]
body = "1.125rem 1.1875rem"
h1 = "2.125rem 3.25rem"
h2 = "1.5rem 1.875rem"
h3 = "1.1875rem 1.3125rem"
h4 = "1.0625rem 1.125rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 700

[space]
unit = "0.5rem"
section = "3.5rem"
