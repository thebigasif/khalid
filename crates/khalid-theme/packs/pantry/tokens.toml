# Pantry: a baking and recipe blog like a recipe box on a floury
# worktop. A flour-white page, a kraft-paper surface for the ingredients
# card and the recipe box tabs, and a cherry accent for the index card's
# header line and the links. A book serif for headings and the system's
# sans for the text. Shapes are square: no rounded corners.
[colors]
background = "#fbf8f1"
surface = "#f2eadb"
text = "#2b211a"
muted = "#5c4f44"
link = "#9b2c2c"
accent = "#9b2c2c"
border = "#e2d7c3"

[fonts]
heading = "Charter, \"Bitstream Charter\", \"Sitka Text\", Cambria, Georgia, serif"
body = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"

[shape]
radius = "0px"
measure = "40rem"

[type]
body = "1.125rem 1.1875rem"
h1 = "2.25rem 3.5rem"
h2 = "1.5rem 2rem"
h3 = "1.25rem 1.375rem"
h4 = "1.0625rem 1.125rem"
small = "0.9375rem"
line_height = 1.6
heading_weight = 700

[space]
unit = "0.5rem"
section = "4rem"
