# Keystone's own look, for a blog that has not run theme sync: a calm
# white page with deep ink, one cobalt accent and a faint cool panel, the
# system's interface font for headings and text, and a bold type scale on
# a wide frame. A synced theme replaces any of these values.
[colors]
background = "#ffffff"
surface = "#f4f6fa"
text = "#0d1526"
muted = "#4f5b6d"
link = "#2340c4"
accent = "#3355e0"
border = "#e1e6ee"

[fonts]
body = "-apple-system, BlinkMacSystemFont, \"Segoe UI Variable Text\", \"Segoe UI\", system-ui, Roboto, \"Helvetica Neue\", sans-serif"
heading = "-apple-system, BlinkMacSystemFont, \"Segoe UI Variable Display\", \"Segoe UI\", system-ui, Roboto, \"Helvetica Neue\", sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, \"Liberation Mono\", monospace"

[type]
body = "1.0625rem 1.1875rem"
h1 = "2.375rem 4.5rem"
h2 = "1.625rem 2.125rem"
h3 = "1.25rem 1.375rem"
h4 = "1.0625rem 1.125rem"
small = "0.875rem 0.9375rem"
line_height = 1.6
heading_weight = 600

[space]
unit = "0.5rem"
section = "5.5rem"

[shape]
radius = "0.75rem"
measure = "35rem"
