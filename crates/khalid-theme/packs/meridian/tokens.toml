[colors]
background = "#fbf9f4"
surface = "#f2eee4"
text = "#16181d"
muted = "#57585c"
link = "#2b3c96"
accent = "#2b3c96"
border = "#e0d9cb"

[fonts]
heading = '"Iowan Old Style", Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif'
body = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'

[type]
body = "1.0625rem 1.1875rem"
h1 = "2.75rem 5rem"
h2 = "1.75rem 2.25rem"
h3 = "1.25rem 1.5rem"
h4 = "1.125rem 1.25rem"
small = "0.875rem"
line_height = 1.7
heading_weight = 600

[space]
unit = "0.5rem"
section = "6rem"

[shape]
radius = "0.375rem"
measure = "42rem"
