# Gallery: a studio's or an illustrator's site. A plaster wall, pale
# mats, near-black ink and one vermilion accent like a printer's red.
# System sans faces until a brand sets its own: a wide one for the titles
# reads best.
[colors]
background = "#efebe4"
surface = "#fbfaf7"
text = "#1b1a17"
muted = "#575249"
link = "#a3301f"
accent = "#a3301f"
border = "#d5cfc4"

[fonts]
heading = "\"Avenir Next\", Avenir, \"Helvetica Neue\", Arial, system-ui, sans-serif"
body = "\"Helvetica Neue\", Arial, system-ui, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

[shape]
radius = "0px"
measure = "40rem"

[type]
body = "1.125rem 1.1875rem"
h1 = "2.25rem 3.5rem"
h2 = "1.5rem 2rem"
h3 = "1.1875rem 1.375rem"
h4 = "1.0625rem 1.125rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 700

[space]
unit = "0.5rem"
section = "5rem"
