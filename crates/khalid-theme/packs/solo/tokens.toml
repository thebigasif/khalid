# Based on Ghost's Solo theme, MIT licence, see LICENSE-ghost.txt.
# Solo's own look (docs/templates/solo.md, "Design"): a white page,
# near-black ink for text, links and buttons, a faint grey panel and
# hairlines, square pictures, and one modern sans for everything, set
# heavy and tight in headings. A value in the site's own
# theme/tokens.toml wins.
[colors]
background = "#ffffff"
surface = "#f2f2f2"
text = "#15171a"
muted = "#5b5f66"
link = "#15171a"
accent = "#15171a"
border = "#e3e3e3"

[fonts]
heading = "Manrope, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
body = "Manrope, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
mono = "\"JetBrains Mono\", ui-monospace, Menlo, Consolas, \"Liberation Mono\", monospace"

[type]
body = "1.0625rem 1.25rem"
h1 = "2.5rem 4.5rem"
h2 = "1.75rem 2.5rem"
h3 = "1.375rem 1.75rem"
h4 = "1.125rem 1.25rem"
small = "0.875rem"
line_height = 1.7
heading_weight = 800

[space]
unit = "0.5rem"
section = "5rem"

[shape]
radius = "0px"
measure = "42rem"
