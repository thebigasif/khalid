# Itinerary: a travel diary. White paper with a kraft surface for the
# tickets and the boarding pass, warm ink, and one rust accent like the ink
# of a passport stamp. A slab serif for titles, a plain sans for the text.
[colors]
background = "#ffffff"
surface = "#f5efe4"
text = "#1e1c1a"
muted = "#5c564e"
link = "#a33a12"
accent = "#b8461a"
border = "#e2d8c8"

[fonts]
heading = "Rockwell, \"Roboto Slab\", \"Zilla Slab\", Georgia, serif"
body = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"

[shape]
radius = "0.375rem"
measure = "38rem"

[type]
body = "1.125rem 1.1875rem"
h1 = "2.125rem 3.25rem"
h2 = "1.5rem 1.875rem"
h3 = "1.1875rem 1.375rem"
h4 = "1.0625rem 1.125rem"
small = "0.875rem"
line_height = 1.65
heading_weight = 700

[space]
unit = "0.5rem"
section = "4rem"
