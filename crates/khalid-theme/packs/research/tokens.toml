# Research: a serious lab site. White paper, near-black ink, one claret
# accent and a warm paper surface for the cite box and the paper panel.
# Serif headings like a printed paper, a plain sans for the text.
[colors]
background = "#ffffff"
surface = "#f5f3ef"
text = "#1b1a1f"
muted = "#55545c"
link = "#8a1c3f"
accent = "#8a1c3f"
border = "#dcd7ce"

[fonts]
heading = "Charter, \"Bitstream Charter\", \"Sitka Text\", Cambria, Georgia, serif"
body = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"

[shape]
radius = "0.125rem"
measure = "42rem"

[type]
body = "1rem 1.0625rem"
h1 = "2rem 3rem"
h2 = "1.375rem 1.75rem"
h3 = "1.125rem 1.25rem"
h4 = "1rem 1.0625rem"
small = "0.875rem"
line_height = 1.65
heading_weight = 600

[space]
unit = "0.5rem"
section = "4rem"
