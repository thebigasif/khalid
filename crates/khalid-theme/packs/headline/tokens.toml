# Based on Ghost's Headline theme, MIT licence, see LICENSE-ghost.txt.
# Headline's defaults: a clean page, near-black ink, light grey hairlines
# and an ink accent, with a modern sans for headings, menus and labels and
# a calm serif for the posts, where the reader has them. A site's own
# tokens replace any of them.
[colors]
background = "#ffffff"
surface = "#f4f4f4"
text = "#15171a"
muted = "#5f6166"
link = "#15171a"
accent = "#15171a"
border = "#e6e6e6"

[fonts]
heading = "Inter, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
body = "Lora, Georgia, \"Times New Roman\", serif"
mono = "Menlo, Consolas, Monaco, \"Liberation Mono\", monospace"

[shape]
radius = "0px"
measure = "37rem"

[type]
body = "1rem"
h1 = "2.25rem 2.75rem"
h2 = "1.5rem 1.75rem"
h3 = "1.25rem 1.5rem"
h4 = "1.125rem 1.25rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 700

[space]
unit = "0.5rem"
section = "5rem"
