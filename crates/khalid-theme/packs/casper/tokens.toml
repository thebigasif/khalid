# Based on Ghost's Casper theme, MIT licence, see LICENSE-ghost.txt.
# Casper's defaults: white paper, near-black ink, light grey lines and
# Ghost's pink as the accent. Titles and the page's own words in the
# system's sans, as Casper's "Modern sans-serif" title font; a post's text
# in Georgia, as its "Elegant serif" body font. A site's own tokens replace
# any of them.
[colors]
background = "#ffffff"
surface = "#f1f1f1"
text = "#15171a"
muted = "#5c6b73"
link = "#d6005a"
accent = "#e6005f"
border = "#e1e1e1"

[fonts]
heading = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Fira Sans\", \"Droid Sans\", \"Helvetica Neue\", sans-serif"
body = "Georgia, Times, serif"
mono = "Menlo, Courier, monospace"

[shape]
radius = "0px"
measure = "42rem"

[type]
body = "1rem"
h1 = "2rem 3.25rem"
h2 = "1.4375rem 1.75rem"
h3 = "1.25rem 1.5rem"
h4 = "1.125rem"
small = "0.8125rem"
line_height = 1.6
heading_weight = 800

[space]
unit = "0.5rem"
section = "4rem"
