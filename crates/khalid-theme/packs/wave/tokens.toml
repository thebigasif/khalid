# Based on Ghost's Wave theme, MIT licence, see LICENSE-ghost.txt.
# Wave's own look, for a blog that has not run theme sync: a white page,
# near-black titles over a soft slate grey for text, a light grey for the
# player and the placeholders, and one orange for the play marks, darkened
# from Wave's so it holds its contrast. Soft 6px corners. Poppins for
# headings and text, as Wave sets them, then the system sans. A value in
# the site's own theme/tokens.toml wins over each of these.
[colors]
background = "#ffffff"
surface = "#f6f6f6"
text = "#1a1a1a"
muted = "#5a656b"
link = "#b05000"
accent = "#c45a00"
border = "#e6e6e6"

[fonts]
heading = "Poppins, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
body = "Poppins, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"

[shape]
radius = "0.375rem"
measure = "37rem"

[type]
body = "1.0625rem 1.125rem"
h1 = "2rem 2.5rem"
h2 = "1.5rem 1.75rem"
h3 = "1.25rem 1.5rem"
h4 = "1.0625rem 1.125rem"
small = "0.8125rem"
line_height = 1.65
heading_weight = 600

[space]
unit = "0.5rem"
section = "4rem"
