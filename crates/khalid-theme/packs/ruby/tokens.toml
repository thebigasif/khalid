# Based on Ghost's Ruby theme, MIT licence, see LICENSE-ghost.txt.
# Ruby's own look, for a blog that has not run theme sync: a page that
# fades from white to a light grey under white cards, dark grey ink, a
# mid grey for small labels and one teal accent for the topic labels.
# Ghost's teal is too light for text, so this one is deeper. One sans for
# everything, set bold in titles. A value in the site's own
# theme/tokens.toml wins.
[colors]
background = "#ffffff"
surface = "#efefef"
text = "#333333"
muted = "#686868"
link = "#0f716a"
accent = "#117a71"
border = "#e9e9e9"

[fonts]
heading = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
body = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"

[type]
body = "1.125rem"
h1 = "1.875rem 2.375rem"
h2 = "1.5rem 1.75rem"
h3 = "1.25rem 1.375rem"
h4 = "1.0625rem 1.125rem"
small = "0.8125rem"
line_height = 1.6
heading_weight = 700

[space]
unit = "0.5rem"
section = "4rem"

[shape]
radius = "0.5rem"
measure = "38rem"
