# Based on Ghost's Taste theme, MIT licence, see LICENSE-ghost.txt.
# Taste's defaults: its cream page, near-black ink, warm hairlines and a
# tomato red for the topic names and buttons. EB Garamond for titles and
# text, as Taste's "Elegant" style sets them, with Garamond and Georgia
# behind it when the blog serves no font files. A site's own tokens
# replace any of them.
[colors]
background = "#faf6e9"
surface = "#f2ecda"
text = "#15171a"
muted = "#5d594d"
link = "#a8321f"
accent = "#b83a22"
border = "#e6e0cf"

[fonts]
heading = "\"EB Garamond\", Garamond, \"Iowan Old Style\", Georgia, serif"
body = "\"EB Garamond\", Garamond, \"Iowan Old Style\", Georgia, serif"
mono = "Menlo, Consolas, Monaco, monospace"

[shape]
radius = "0px"
measure = "36rem"

[type]
body = "1.125rem"
h1 = "2.25rem 3.75rem"
h2 = "1.75rem 2.375rem"
h3 = "1.375rem 1.5rem"
h4 = "1.1875rem"
small = "0.9375rem"
line_height = 1.6
heading_weight = 600

[space]
unit = "0.5rem"
section = "5rem"
