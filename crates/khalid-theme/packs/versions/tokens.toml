# Versions: a product changelog. White page, near-black ink, one blue
# accent for the newest version and the New changes, and a pale grey
# surface for the update box and the change facts. One sans for titles
# and text, and the monospace for version numbers.
[colors]
background = "#ffffff"
surface = "#f4f5f2"
text = "#16191d"
muted = "#525a62"
link = "#1d4fb8"
accent = "#1d4fb8"
border = "#dde1e4"

[fonts]
heading = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"
body = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"
mono = "ui-monospace, SFMono-Regular, Menlo, Consolas, \"Liberation Mono\", monospace"

[shape]
radius = "0.375rem"
measure = "40rem"

[type]
body = "1rem 1.0625rem"
h1 = "2rem 2.75rem"
h2 = "1.375rem 1.625rem"
h3 = "1.125rem 1.25rem"
h4 = "1rem 1.0625rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 600

[space]
unit = "0.5rem"
section = "3.5rem"
