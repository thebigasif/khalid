# Beacon: a charity's site. White paper, warm ink, one ember accent for
# the donate call and the goal meters, and a warm surface for the impact
# band. A sturdy slab for headings and figures, a friendly sans for text.
[colors]
background = "#ffffff"
surface = "#faf4ec"
text = "#1f1d1a"
muted = "#5a544c"
link = "#a13d16"
accent = "#a13d16"
border = "#e6dccd"

[fonts]
heading = "Rockwell, \"Roboto Slab\", \"Bitstream Charter\", Georgia, serif"
body = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"

[shape]
radius = "0.125rem"
measure = "40rem"

[type]
body = "1.0625rem 1.125rem"
h1 = "2.125rem 3.25rem"
h2 = "1.5rem 2rem"
h3 = "1.1875rem 1.375rem"
h4 = "1.0625rem 1.125rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 700

[space]
unit = "0.5rem"
section = "4.5rem"
