# Based on Ghost's Bulletin theme, MIT licence, see LICENSE-ghost.txt.
# Bulletin's own look, for a blog that has not run theme sync: a white
# page, near-black ink, light grey hairlines and one punchy pink accent
# that fills the front page's sign-up panel. Headings, labels and lists in
# the system's sans, set heavy; posts in the system's serif. A value in
# the site's own theme/tokens.toml wins.
[colors]
background = "#ffffff"
surface = "#f6f6f6"
text = "#15171a"
muted = "#63676d"
link = "#b80d4f"
accent = "#d1105a"
border = "#e6e6e6"

[fonts]
heading = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif"
body = "\"Iowan Old Style\", Charter, \"Bitstream Charter\", \"Sitka Text\", Cambria, Georgia, serif"

[type]
body = "1.0625rem 1.125rem"
h1 = "2rem 2.875rem"
h2 = "1.625rem 1.75rem"
h3 = "1.375rem 1.5rem"
h4 = "1.1875rem 1.375rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 800

[space]
unit = "0.5rem"
section = "4rem"

[shape]
radius = "0.25rem"
measure = "45rem"
