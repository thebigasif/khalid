# Spectrum: a magazine arranged by topic. Ink on white with an ink blue
# accent; each topic's colour is the accent turned round the colour wheel
# (spectrum.css), so the whole spectrum follows the site's own accent. A
# sturdy grotesque for titles and labels, a text serif to read.
[colors]
background = "#ffffff"
surface = "#f3f1ec"
text = "#17171a"
muted = "#55555c"
link = "#1f4fbf"
accent = "#1f4fbf"
border = "#dedad2"

[fonts]
heading = "\"Helvetica Neue\", \"Segoe UI\", system-ui, -apple-system, Roboto, Arial, sans-serif"
body = "Charter, \"Bitstream Charter\", \"Sitka Text\", Cambria, Georgia, serif"

[shape]
radius = "0rem"
measure = "40rem"

[type]
body = "1.125rem 1.25rem"
h1 = "2.25rem 3.5rem"
h2 = "1.5rem 2.125rem"
h3 = "1.25rem 1.5rem"
h4 = "1.0625rem 1.1875rem"
small = "0.875rem"
line_height = 1.6
heading_weight = 700

[space]
unit = "0.5rem"
section = "4rem"
