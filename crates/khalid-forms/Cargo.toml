[package]
name = "khalid-forms"
version.workspace = true
description = "The form block's answers on a running site: the route, its spam trap and limits, and where answers are kept."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["form", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
khalid-comments = { path = "../khalid-comments", version = "1.0.1" }
khalid-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
khalid-core = { workspace = true, features = ["test-util"] }
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
