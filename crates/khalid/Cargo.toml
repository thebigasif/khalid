[package]
name = "khalid"
version.workspace = true
description = "An open-source blog engine with SEO defaults built in, by SerpDad."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
khalid-admin = { path = "../khalid-admin", version = "1.1.1" }
khalid-alerts = { path = "../khalid-alerts", version = "1.1.1" }
khalid-analytics = { path = "../khalid-analytics", version = "1.1.1" }
khalid-api = { path = "../khalid-api", version = "1.1.1" }
khalid-audit = { path = "../khalid-audit", version = "1.1.1" }
khalid-auth = { path = "../khalid-auth", version = "1.1.1" }
khalid-comments = { path = "../khalid-comments", version = "1.1.1" }
khalid-content = { path = "../khalid-content", version = "1.1.1" }
khalid-core.workspace = true
khalid-routes = { path = "../khalid-routes", version = "1.1.1" }
khalid-db = { path = "../khalid-db", version = "1.1.1" }
khalid-forms = { path = "../khalid-forms", version = "1.1.1" }
khalid-https = { path = "../khalid-https", version = "1.1.1" }
khalid-import = { path = "../khalid-import", version = "1.1.1" }
khalid-lint.workspace = true
khalid-mcp = { path = "../khalid-mcp", version = "1.1.1" }
khalid-mount = { path = "../khalid-mount", version = "1.1.1" }
khalid-media = { path = "../khalid-media", version = "1.1.1" }
khalid-render = { path = "../khalid-render", version = "1.1.1" }
khalid-search = { path = "../khalid-search", version = "1.1.1" }
khalid-search-console = { path = "../khalid-search-console", version = "1.1.1" }
khalid-seo = { path = "../khalid-seo", version = "1.1.1" }
khalid-share-image = { path = "../khalid-share-image", version = "1.1.1" }
khalid-mail = { path = "../khalid-mail", version = "1.1.1" }
khalid-newsletter = { path = "../khalid-newsletter", version = "1.1.1" }
khalid-server = { path = "../khalid-server", version = "1.1.1" }
khalid-static = { path = "../khalid-static", version = "1.1.1" }
khalid-outbound = { path = "../khalid-outbound", version = "1.1.1" }
khalid-theme = { path = "../khalid-theme", version = "1.1.1" }
khalid-webhooks = { path = "../khalid-webhooks", version = "1.1.1" }
axum = { version = "0.8", default-features = false, features = ["form", "query"] }
chrono = { version = "0.4", default-features = false }
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
hmac = "0.13"
mimalloc = { version = "0.1", features = ["no_thp"] }
percent-encoding = "2"
serde.workspace = true
serde-saphyr = "2"
serde_json.workspace = true
subtle = "2"
tempfile = "3"
tokio = { workspace = true, features = ["rt", "net", "sync", "io-std", "io-util"] }
toml = "1.1"
toml_edit = "0.25"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing.workspace = true
tar = { version = "0.4", default-features = false }
semver = "1"
sha2 = "0.11"
flate2 = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Switches transparent huge pages off for `khalid serve`, safely.
rustix = { version = "1", default-features = false, features = ["std", "thread"] }

[features]
# The hidden --test-hosts flag, for CLI tests against a local stand-in, and
# the throwaway trial template pack. Release builds leave it off, so the
# private-network guard has no switch and only real packs ship.
test-util = ["khalid-outbound/test-util", "khalid-theme/test-util"]

[dev-dependencies]
atom_syndication = "0.12"
khalid-api = { path = "../khalid-api", version = "1.1.1", features = ["test-util"] }
khalid-core = { workspace = true, features = ["test-util"] }
khalid-alerts = { path = "../khalid-alerts", version = "1.1.1", features = ["test-util"] }
khalid-mail = { path = "../khalid-mail", version = "1.1.1", features = ["test-util"] }
khalid-newsletter = { path = "../khalid-newsletter", version = "1.1.1", features = ["test-util"] }
image = { version = "0.25", default-features = false, features = ["png"] }
insta = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rss = { version = "2", features = ["validation"] }
scraper = "0.29"
serde_json.workspace = true
tokio.workspace = true
wiremock = "0.6"

[[test]]
name = "theme"
required-features = ["test-util"]

[[test]]
name = "build_template"
required-features = ["test-util"]

[[test]]
name = "build_parts"
required-features = ["test-util"]

[[test]]
name = "build_every_template"
required-features = ["test-util"]

[[test]]
name = "serve_look"
required-features = ["test-util"]

[[test]]
name = "doctor_address"
required-features = ["test-util"]

[[test]]
name = "serve_publish"
required-features = ["test-util"]

[[test]]
name = "publish_cli"
required-features = ["test-util"]

[[test]]
name = "serve_webhooks"
required-features = ["test-util"]

[[test]]
name = "serve_entry_webhooks"
required-features = ["test-util"]

[[test]]
name = "audit_webhooks"
required-features = ["test-util"]

[[test]]
name = "serve_form_delivery"
required-features = ["test-util"]

[[test]]
name = "serve_https"
required-features = ["test-util"]

[[test]]
name = "serve_pebble"
required-features = ["test-util"]

[[test]]
name = "import_site"
required-features = ["test-util"]

[[test]]
name = "audit_outside"
required-features = ["test-util"]

[[test]]
name = "serve_alerts"
required-features = ["test-util"]

[[test]]
name = "serve_watch"
required-features = ["test-util"]

[[test]]
name = "audit_alerts"
required-features = ["test-util"]

[[test]]
name = "bing_cli"
required-features = ["test-util"]

[[test]]
name = "serve_indexnow"
required-features = ["test-util"]

[[test]]
name = "update_release"
required-features = ["test-util"]

[[test]]
name = "serve_visitor_log"
required-features = ["test-util"]

[lints]
workspace = true
