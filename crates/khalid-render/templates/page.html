{% extends "base.html" %}
{% block main %}
{% from "slots.html" import cta_band -%}
<article class="page">
<h1>{{ page.title }}</h1>
<div class="page-body">
{{ page.body | place_cta(cta_band(template.cta) if template.cta else "") }}
</div>
{% if page.updated %}<p class="page-updated">{{ t.updated }} <time datetime="{{ page.updated }}">{{ page.updated | date }}</time></p>
{% endif %}</article>
{% endblock %}
